apiVersion: apps/v1
kind: Deployment
metadata:
  name: esgame-calculation
  labels:
    app: esgame-calculation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esgame-calculation
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: esgame-calculation
    spec:
      # Base ships an ephemeral data dir. An overlay (e.g. places) replaces this with a
      # PersistentVolumeClaim + an init container that loads its geodata — see ../../README.md.
      volumes:
        - name: app-data
          emptyDir: {}
        # R puts tempdir() under TMPDIR (/tmp by default) and writes there throughout a round —
        # raster's own temp files among them. The only path a read-only root needs beyond the
        # /app/data mount below; measured by running the published image with `--read-only`.
        - name: tmp
          emptyDir: {}
      securityContext:
        # /app/data is a mount, so its ownership comes from the volume, not the image.
        # calculator.r does setwd() there and writes seven rasters plus the spider plot, and a
        # bare emptyDir is created root-owned — the calculation would start and then fail on its
        # first write. fsGroup 0 matches the image's `useradd --gid 0` and makes the kubelet set
        # group ownership on the volume.
        fsGroup: 0
      containers:
        - name: esgame-calculation
          image: esgame-calculation # rewritten by kustomization.yaml images:
          imagePullPolicy: Always
          env:
            - name: GEOSERVER
              valueFrom:
                configMapKeyRef:
                  name: esgame-config
                  key: GEOSERVER_URL
            # The WCS URLs the calculator returns are fetched by the browser, not by the cluster,
            # so they are built from the public host rather than the Service name above.
            - name: GEOSERVER_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: esgame-config
                  key: GEOSERVER_PUBLIC_URL
            # calculator.r creates a workspace and uploads coverages per game/round through
            # GeoServer's REST API, so it needs the same admin credentials.
            - name: GEOSERVER_USER
              valueFrom:
                secretKeyRef:
                  name: esgame-geoserver-admin
                  key: username
            - name: GEOSERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esgame-geoserver-admin
                  key: password
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          # Without this the pod is "ready" the instant the container starts, and the Service
          # sends it traffic while plumber is still binding — about 12 seconds. That is not
          # hypothetical: a POST straight after a rollout returned 503 from the ingress, and it
          # looked exactly like a broken endpoint.
          #
          # tcpSocket, not httpGet, because nothing here answers 2xx-3xx: measured from inside
          # the cluster, / is 404 and /esgame is 405 (it is POST-only). Only /__docs__/ returns
          # 200, and depending on swagger being enabled would be a worse probe than checking the
          # port accepts connections — which is precisely what was missing.
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          # allowPrivilegeEscalation stops a setuid binary gaining privileges the container did
          # not start with, and RuntimeDefault applies the container runtime's seccomp filter.
          # Neither needs anything from the image.
          #
          # readOnlyRootFilesystem holds because both paths this writes are mounts: /app/data,
          # where calculator.r does setwd() and writes its rasters and the spider plot, and /tmp,
          # which is where R puts tempdir(). An earlier comment here said R "writes to its library
          # and temp paths outside the /app/data mount" — the library is read at run time, not
          # written to, and the temp paths are now mounted.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            # tools/R/Dockerfile now runs as uid 10001. runAsNonRoot is the assertion the
            # kubelet enforces at admission — it does not change the user, it refuses to start a
            # container whose image resolves to uid 0, so it only means anything once the image
            # cooperates. runAsUser repeats the number so the manifest is explicit rather than
            # relying on whatever the image happens to say.
            #
            # The frontend asserts the same thing with uid 101 since 2026-08-05, when its image
            # moved to an unprivileged nginx on 8080. GeoServer is upstream and is now the only
            # container here still measured as uid 0 — see docs/verification-status.rst.
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
