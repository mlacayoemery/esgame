apiVersion: v1
kind: ConfigMap
metadata:
  name: esgame-config
data:
  # Public URL of the calculation backend. The BROWSER posts here (client-side), so it must be the
  # externally reachable calculation ingress host — NOT the in-cluster service name. Injected into
  # the frontend's assets/config.json at container start by the image entrypoint (no rebuild).
  # Set to "" to ship a client-side-only (grid) deployment with no backend.
  CALC_URL: "https://change-me-esgame-calculation.example.com"

  # In-cluster GeoServer URL used by the calculation backend (server-to-server) to publish
  # coverages over the REST API.
  GEOSERVER_URL: "http://esgame-geoserver-service:8080/geoserver"

  # Public GeoServer URL. The calculation returns WCS GetCoverage URLs built from THIS, and the
  # browser fetches them — so like CALC_URL it must be the externally reachable ingress host, not
  # the Service name above. Leave it equal to GEOSERVER_URL and every round still returns 200 with
  # coverage URLs no client can resolve. See geoserver-ingress.yaml for the matching host.
  GEOSERVER_PUBLIC_URL: "https://change-me-esgame-geoserver.example.com/geoserver"

  # The board the calculation backend scores against, and the pair of the frontend's
  # DYNAMIC_DATA_URL. STATED, not defaulted: calculator.r refuses to start without it, because a
  # deployment that never says which board it serves would otherwise get one chosen for it and come
  # up healthy. overlays/rectangular overrides both together.
  #
  # The file has to be in /app/data — an emptyDir here, filled by an init container in the
  # overlays, a PersistentVolumeClaim in places.
  ESGAME_BASE_RASTER: "LU_and_NEW_hexa.tif"
