apiVersion: apps/v1
kind: Deployment
metadata:
  name: esgame-angular
  labels:
    app: esgame-angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esgame-angular
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: esgame-angular
    spec:
      containers:
        - name: esgame-angular
          image: esgame-angular # rewritten by kustomization.yaml images:
          imagePullPolicy: Always
          env:
            # The entrypoint substitutes this into assets/config.json on start (runtime config).
            - name: CALC_URL
              valueFrom:
                configMapKeyRef:
                  name: esgame-config
                  key: CALC_URL
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          # The safe subset only. All three images run as uid 0 — measured, not assumed — so
          # runAsNonRoot would break every one of them and readOnlyRootFilesystem would break
          # nginx's cache dir, GeoServer's data dir and the calculator's /app/data. Those need
          # image changes, not a manifest change, and are deliberately not attempted here.
          #
          # These two do not: allowPrivilegeEscalation stops a setuid binary gaining privileges
          # the container did not start with, and RuntimeDefault applies the container runtime's
          # seccomp filter. Verified on a live cluster — all three roll out, 16/16 in
          # ingress-test.sh, and both browser rounds pass.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
