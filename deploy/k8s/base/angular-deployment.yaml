apiVersion: apps/v1
kind: Deployment
metadata:
  name: esgame-angular
  labels:
    app: esgame-angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esgame-angular
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: esgame-angular
    spec:
      volumes:
        # nginx's pid file and its proxy/client/fastcgi/uwsgi/scgi temp paths all live under /tmp
        # in the unprivileged image, so a read-only root needs exactly this one writable.
        - name: tmp
          emptyDir: {}
        # And this one, because the entrypoint rewrites assets/config.json IN PLACE to inject
        # CALC_URL. Seeded below — an emptyDir starts empty, unlike a docker named volume, which
        # auto-populates from the image and makes this look unnecessary when tested with docker.
        - name: assets
          emptyDir: {}
      initContainers:
        # Copies the image's own assets into the emptyDir that will shadow them. Same image, so it
        # copies whatever that image ships — which is how a downstream overlay (places bakes its
        # own data.json, config.json and rasters) keeps working without knowing this exists.
        - name: seed-assets
          image: esgame-angular # rewritten by kustomization.yaml images:
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # -R, not -a: -a tries to preserve ownership and timestamps on the emptyDir root,
              # which uid 101 does not own, and prints three "Operation not permitted" lines that
              # read like failures while the copy succeeds. Nothing here needs either preserved.
              cp -R /usr/share/nginx/html/assets/. /seed/
              # Presence, not exit status: cp can copy nothing and succeed. config.json is what the
              # entrypoint rewrites, so its absence is the failure that would otherwise surface as
              # a served 404 with the pod reporting healthy.
              [ -s /seed/config.json ] || { echo "!! assets/config.json missing after seed" >&2; exit 1; }
              echo ">> seeded $(find /seed -type f | wc -l) asset file(s)"
          volumeMounts:
            - name: assets
              mountPath: /seed
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: esgame-angular
          image: esgame-angular # rewritten by kustomization.yaml images:
          imagePullPolicy: Always
          env:
            # The entrypoint substitutes these into assets/config.json on start (runtime config).
            - name: CALC_URL
              valueFrom:
                configMapKeyRef:
                  name: esgame-config
                  key: CALC_URL
            # Which game "/" serves, and which dataset the dynamic one loads. Together with the
            # calculation container's ESGAME_BASE_RASTER these choose the BOARD — the hexagonal one
            # by default, the rectangular one in overlays/rectangular.
            #
            # optional: true on both, so this base behaves EXACTLY as it did for every overlay that
            # does not set them: an unset variable makes the entrypoint leave the built-in
            # config.json alone. Without it, adding these keys would stop every downstream overlay's
            # frontend from starting until its own esgame-config carried them — a base change that
            # breaks deployments this repository cannot see.
            #
            # They must not be present-but-empty either. The entrypoint refuses DEFAULT_MODE="" (it
            # is neither "static" nor "dynamic") rather than silently serving the wrong game, so a
            # configMap that defines the key as "" fails the pod at start. That is why the base
            # configmap does not define them at all.
            - name: DEFAULT_MODE
              valueFrom:
                configMapKeyRef:
                  name: esgame-config
                  key: DEFAULT_MODE
                  optional: true
            - name: DYNAMIC_DATA_URL
              valueFrom:
                configMapKeyRef:
                  name: esgame-config
                  key: DYNAMIC_DATA_URL
                  optional: true
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: assets
              mountPath: /usr/share/nginx/html/assets
          # runAsUser 101 is the `nginx` user in nginxinc/nginx-unprivileged, which v2/Dockerfile
          # now builds on. runAsNonRoot is the half the kubelet enforces at admission: it refuses
          # to start the pod if the image's uid is 0, so a base-image regression fails loudly here
          # instead of quietly restoring root. That is why both are set and not just runAsUser.
          #
          # readOnlyRootFilesystem needs the two mounts above and nothing else — measured by
          # running the published image with `--read-only` and reading what it failed on, twice:
          #   no writable paths   mktemp: : Read-only file system
          #   /tmp only           mv: can't remove '.../assets/config.json': Read-only file system
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
