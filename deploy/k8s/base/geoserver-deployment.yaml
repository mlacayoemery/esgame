apiVersion: apps/v1
kind: Deployment
metadata:
  name: esgame-geoserver
  labels:
    app: esgame-geoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esgame-geoserver
  template:
    metadata:
      labels:
        app: esgame-geoserver
    spec:
      containers:
        - name: esgame-geoserver
          # Built here, from deploy/geoserver/Dockerfile: upstream GeoServer runs as uid 0 at every
          # version and this one does not. Same image in v2/docker-compose.dynamic.yml and
          # examples/esgame-dynamic/docker-compose.yml, so what is developed against is what is
          # deployed — and compose has no ingress supplying CORS, which makes GeoServer's own
          # CORS_ENABLED load-bearing there in a way it is not here.
          #
          # A rolling :master tag, like the other two images. GeoServer's version is pinned inside
          # the Dockerfile (3.0.0) rather than here.
          image: ghcr.io/mlacayoemery/esgame-geoserver:master
          imagePullPolicy: Always
          env:
            - name: CORS_ENABLED
              value: "true"
            # Without these the image keeps its default admin/geoserver login — on a
            # deployment whose REST API is published through geoserver-ingress, and which
            # the calculation backend uses to create workspaces and upload coverages.
            # Deliberately required, with no default: a missing Secret must stop the
            # rollout, not silently ship well-known credentials.
            - name: GEOSERVER_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: esgame-geoserver-admin
                  key: username
            - name: GEOSERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esgame-geoserver-admin
                  key: password
          ports:
            - containerPort: 8080
              protocol: TCP
          # GeoServer reports the container up long before the web app and REST API are
          # serving, so the Deployment went "available" while requests still failed —
          # deploy/k8s/kind.sh carries a poll loop for exactly this.
          #
          # /geoserver/index.html, because it answers 200 directly. The other candidates were
          # measured against a running pod and all fail as probes:
          #
          #   /geoserver/web/                302 -> Location: ./?0   relative, and it LOOPS
          #   /geoserver/rest/about/...      401                     needs credentials
          #   /                              404
          #
          # A Kubernetes httpGet probe FOLLOWS redirects and gives up after ten, so /geoserver/web/
          # never succeeded — "Readiness probe failed: Get \"./\": stopped after 10 redirects", and
          # the rollout timed out. Reading only the first response and seeing 302 in the 200-399
          # success range is what made that look correct.
          readinessProbe:
            httpGet:
              path: /geoserver/index.html
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          # All three containers run non-root now. This was the last one: the frontend is uid 101,
          # the calculation image uid 10001, and this is uid 10001 because deploy/geoserver builds
          # it that way. UPSTREAM STILL CANNOT DO THIS — read from docker.osgeo.org's registry
          # config blobs on 2026-08-14, both 2.28.4 and 3.0.0 declare User "" — so the uid comes
          # from a chmod applied at build time, not from anything set here.
          #
          # Do not try to reproduce it with runAsUser against the upstream image. That does not
          # fail, it 404s: Tomcat logs `Server startup in [28806] milliseconds` while the webapp
          # never deployed, because it could not create
          # /usr/local/tomcat/conf/Catalina/localhost or rewrite its own server.xml. The readiness
          # probe below does catch it — /geoserver/index.html is part of the undeployed webapp — so
          # the pod never goes Ready. And seeding those paths as emptyDirs from an initContainer,
          # which was tried, gets a Ready pod and 18/18 in ingress-test.sh while GeoServer's own
          # CORS preflight silently drops from 200 to 403. See deploy/geoserver/Dockerfile.
          #
          # readOnlyRootFilesystem is STILL refused, and for a reason the new image does not touch:
          # the startup script rewrites server.xml on every boot, so the root filesystem has to be
          # writable whoever owns it. Run with
          # --read-only it does NOT fail; Tomcat binds and reports "Server startup in 6409 ms"
          # while:
          #
          #   /opt/startup.sh: line 14: /usr/local/tomcat/conf/server.xml: Read-only file system
          #   /opt/startup.sh: line 44: .../conf/healthcheck_url.txt: Read-only file system
          #   sed: couldn't open temporary file /usr/local/tomcat/conf/sedpbEUk0: Read-only ...
          #   java.io.FileNotFoundException: /usr/local/tomcat/logs/catalina.<date>.log
          #
          # A server that starts having ignored its configuration is worse than one that refuses
          # to, which is the whole argument, and it is unchanged by owning the image: making the
          # root filesystem read-only would still need those paths supplied as volumes.
          #
          # Verified on a live cluster with this image: uid 10001 in the pod, zero
          # permission-denied lines in the log, CORS preflight 200 carrying
          # Access-Control-Allow-Origin, ingress-test.sh 18/18, both e2e-cluster browser rounds,
          # and tools/R/golden-test.sh unchanged at HC 66 / HH 65 / NP 60 / RV 68 / WA 72 — which
          # is the check that matters for a GeoServer version bump, because the calculator drives
          # its REST API to create a workspace and upload five coverages per round.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
