apiVersion: apps/v1
kind: Deployment
metadata:
  name: esgame-geoserver
  labels:
    app: esgame-geoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esgame-geoserver
  template:
    metadata:
      labels:
        app: esgame-geoserver
    spec:
      containers:
        - name: esgame-geoserver
          # Pinned to a specific patch, matching v2/docker-compose.dynamic.yml and
          # examples/esgame-dynamic/docker-compose.yml. 2.24.x was a rolling tag.
          image: docker.osgeo.org/geoserver:2.28.4
          imagePullPolicy: Always
          env:
            - name: CORS_ENABLED
              value: "true"
            # Without these the image keeps its default admin/geoserver login — on a
            # deployment whose REST API is published through geoserver-ingress, and which
            # the calculation backend uses to create workspaces and upload coverages.
            # Deliberately required, with no default: a missing Secret must stop the
            # rollout, not silently ship well-known credentials.
            - name: GEOSERVER_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: esgame-geoserver-admin
                  key: username
            - name: GEOSERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esgame-geoserver-admin
                  key: password
          ports:
            - containerPort: 8080
              protocol: TCP
          # GeoServer reports the container up long before the web app and REST API are
          # serving, so the Deployment went "available" while requests still failed —
          # deploy/k8s/kind.sh carries a poll loop for exactly this.
          #
          # /geoserver/index.html, because it answers 200 directly. The other candidates were
          # measured against a running pod and all fail as probes:
          #
          #   /geoserver/web/                302 -> Location: ./?0   relative, and it LOOPS
          #   /geoserver/rest/about/...      401                     needs credentials
          #   /                              404
          #
          # A Kubernetes httpGet probe FOLLOWS redirects and gives up after ten, so /geoserver/web/
          # never succeeded — "Readiness probe failed: Get \"./\": stopped after 10 redirects", and
          # the rollout timed out. Reading only the first response and seeing 302 in the 200-399
          # success range is what made that look correct.
          readinessProbe:
            httpGet:
              path: /geoserver/index.html
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          # The safe subset only. All three images run as uid 0 — measured, not assumed — so
          # runAsNonRoot would break every one of them and readOnlyRootFilesystem would break
          # nginx's cache dir, GeoServer's data dir and the calculator's /app/data. Those need
          # image changes, not a manifest change, and are deliberately not attempted here.
          #
          # These two do not: allowPrivilegeEscalation stops a setuid binary gaining privileges
          # the container did not start with, and RuntimeDefault applies the container runtime's
          # seccomp filter. Verified on a live cluster — all three roll out, 16/16 in
          # ingress-test.sh, and both browser rounds pass.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
