# Dev overlay: run the whole stack on a local cluster, pulling from the local registry.
#
#   deploy/registry/registry.sh up && deploy/registry/registry.sh push
#   deploy/k8s/kind.sh up                       # cluster + ingress-nginx + registry wiring
#   kubectl apply -k deploy/k8s/overlays/local-registry
#
# The base's ghcr defaults and change-me hosts are what a real deployment wants, so they are NOT
# edited. Everything local lives here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# IMPORTANT: these key on the names the base rewrites images TO, not the logical names.
# Kustomize applies the base's own images transformer first, so by the time this overlay runs
# `esgame-angular` no longer appears anywhere — an entry keyed on it matches nothing, does not
# warn, and leaves the ghcr image deployed. That exact mistake shipped once; see ../../README.md.
images:
  - name: ghcr.io/mlacayoemery/esgame
    newName: localhost:5001/esgame
    newTag: local
  - name: ghcr.io/mlacayoemery/esgame-calculation
    newName: localhost:5001/esgame-calculation
    newTag: local

patches:
  # Real hosts, and a real IngressClass. The base leaves ingressClassName commented out because it
  # cannot know the cluster's controller; without either a class or a cluster default, an Ingress
  # applies cleanly and routes nothing at all, silently. kind.sh installs ingress-nginx, so:
  - target: { kind: Ingress, name: esgame-angular-ingress }
    patch: |
      - op: add
        path: /spec/ingressClassName
        value: nginx
      - op: replace
        path: /spec/rules/0/host
        value: esgame.local
  - target: { kind: Ingress, name: esgame-calculation-ingress }
    patch: |
      - op: add
        path: /spec/ingressClassName
        value: nginx
      - op: replace
        path: /spec/rules/0/host
        value: esgame-calculation.local
  - target: { kind: Ingress, name: esgame-geoserver-ingress }
    patch: |
      - op: add
        path: /spec/ingressClassName
        value: nginx
      - op: replace
        path: /spec/rules/0/host
        value: esgame-geoserver.local

  # tls-acme would have cert-manager try to issue a real certificate for a .local host. Nothing
  # is listening for the ACME challenge here, so drop the annotation rather than leave it failing.
  - target: { kind: Ingress, annotationSelector: "kubernetes.io/tls-acme" }
    patch: |
      - op: remove
        path: /metadata/annotations/kubernetes.io~1tls-acme

# The base gives esgame-calculation an emptyDir at /app/data and nothing that fills it, so the
# deployed calculator has no base raster: `raster("LU_and_NEW_hexa.tif")` fails and every round
# returns 500. A real deployment supplies the geodata (places does it with a PVC and an init
# container); for a dev cluster the 111 KB raster the repo already ships is enough.
#
# The ConfigMap holding it is created by `kind.sh deploy`, not generated here: kustomize refuses
# to read files outside the kustomization directory, and copying a binary into the overlay to
# work around that is worse than one imperative create — which is how the GeoServer Secret is
# handled too.
  # Copy, do not mount onto /app/data. calculation.r does setwd("/app/data") and writes its
  # output rasters and the spider plot back there, and a ConfigMap mount is read-only — the
  # same constraint places hit. Stage the ConfigMap elsewhere and copy into the emptyDir.
  - target: { kind: Deployment, name: esgame-calculation }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: esgame-calculation
      spec:
        template:
          spec:
            volumes:
              - name: geodata-src
                configMap:
                  name: esgame-calculation-geodata
            initContainers:
              - name: load-geodata
                image: alpine:3.22
                env:
                  # The raster the CALCULATION container will read, so this asserts the file that
                  # deployment actually needs rather than the one that used to be the only option.
                  # kind.sh puts both boards in the configMap; which one is required depends on
                  # esgame-config, and overlays/rectangular sets it to LU_and_NEW_rect.tif.
                  - name: ESGAME_BASE_RASTER
                    valueFrom:
                      configMapKeyRef:
                        name: esgame-config
                        key: ESGAME_BASE_RASTER
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -eu
                    # No fallback: the calculation container refuses to start without this, so
                    # a default here would only move the failure later and make it less clear.
                    want="${ESGAME_BASE_RASTER:?the calculation container requires it; set it in esgame-config}"
                    cp -n /srv/geodata/*.tif /data/ 2>/dev/null || true
                    [ -s "/data/${want}" ] || {
                      echo "!! ${want} is missing from /data; the calculation container will refuse to start." >&2
                      echo "   the geodata configMap holds: $(ls /srv/geodata 2>/dev/null | tr '\n' ' ')" >&2
                      exit 1
                    }
                    echo ">> geodata ready: $(ls /data | wc -l) file(s), base raster ${want}"
                volumeMounts:
                  - name: geodata-src
                    mountPath: /srv/geodata
                  - name: app-data
                    mountPath: /data

configMapGenerator:
  - name: esgame-config
    behavior: merge
    literals:
      # Both of these are fetched by the BROWSER, so they must be the ingress hosts above — not
      # Service names. Plain http: no TLS on a .local cluster.
      #
      # The :8880 is load-bearing. kind publishes the ingress controller on a host port, not on
      # 80, so a browser given a portless URL posts to port 80 where nothing listens — the round
      # fails with a connection error while every Host-header curl in ingress-test.sh passes.
      # Keep in step with KIND_HTTP_PORT; kind.sh checks that they agree and refuses otherwise.
      - CALC_URL=http://esgame-calculation.local:8880/esgame
      - GEOSERVER_PUBLIC_URL=http://esgame-geoserver.local:8880/geoserver
