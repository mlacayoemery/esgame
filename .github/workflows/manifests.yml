name: Validate deploy artifacts

# deploy/k8s had one commit and no gate: it was added, never re-run, and drifted
# (GeoServer stayed on a rolling 2.24.x tag while both compose stacks moved to 2.28.4).
# This renders the Kustomize base and schema-checks the result, so drift and typos fail
# a PR instead of waiting for someone to apply them to a real cluster.
#
# Schema validation is not sufficient on its own. `kubeconform -strict` passed all ten
# resources while the API server rejected three of them: an Ingress host is just a string
# in the OpenAPI schema, so an uppercase placeholder validated cleanly and then failed
# `kubectl apply` with an RFC 1123 error. The dry-run job below exists for that whole class
# — anything the API server enforces but the schema does not.
on:
  pull_request:
    paths: ['deploy/**', 'tools/R/**', 'examples/**', 'v2/docker-compose*.yml', 'Makefile', '.github/workflows/manifests.yml']
  push:
    branches: [master]
    paths: ['deploy/**', 'tools/R/**', 'examples/**', 'v2/docker-compose*.yml', 'Makefile', '.github/workflows/manifests.yml']
  schedule:
    # Mondays 06:20 UTC, offset from the CI job so both do not start at once.
    - cron: '20 6 * * 1'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render the Kustomize base
        run: |
          curl -sSfL -o kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          ./kustomize build deploy/k8s/base > rendered.yaml
          echo "rendered $(grep -c '^kind:' rendered.yaml) resources"

      # ubuntu-latest ships no R. install-r must stay true — `install-r: false` tells setup-r to
      # use a pre-installed one, which gives "Rscript: command not found" and exit 127.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Schema-check against the Kubernetes API
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml

      - name: The compose stacks must be valid
        run: |
          # `docker compose config` parses, interpolates and schema-checks without running
          # anything. Nothing validated these: examples/ matched no workflow at all, so a broken
          # compose file in a stack the README tells people to run would surface only when
          # somebody ran it.
          #
          # The stacks come FROM THE MAKEFILE rather than from a glob, because two of these
          # files are overlays. v2/docker-compose.dynamic.yml has a service with no image — the
          # base supplies it — so validating it alone reports "service esgame-core has neither
          # an image nor a build context", which is a defect in the check rather than the file.
          # Reading the Makefile also means a stack added there is covered the day it is added.
          set -euo pipefail
          mapfile -t stacks < <(grep -oE 'docker compose( -[a-z] [^ ]+)*( -f [^ ]+)+' Makefile | sort -u)
          echo "${#stacks[@]} stacks found in the Makefile"
          # Presence first: a Makefile rewrite would otherwise validate nothing and pass.
          if [ "${#stacks[@]}" -lt 3 ]; then
            echo "::error file=Makefile::found ${#stacks[@]} compose stacks; this check is not looking at the right place"
            exit 1
          fi
          bad=0
          for cmd in "${stacks[@]}"; do
            files=$(grep -oE '\-f [^ ]+' <<<"$cmd" | tr '\n' ' ')
            if ${cmd} config -q 2>/tmp/err; then
              echo "  ok   ${files}"
            else
              echo "::error::docker compose cannot parse ${files}: $(head -c 200 /tmp/err)"
              bad=1
            fi
          done
          exit $bad

      - name: Check the GeoServer pin matches the compose stacks
        run: |
          # One version of GeoServer across k8s and both compose files, and never a
          # rolling tag — the drift this workflow exists to catch.
          for f in deploy/k8s/base v2/docker-compose.dynamic.yml examples/esgame-dynamic/docker-compose.yml; do
            [ -e "$f" ] || { echo "::error::$f is gone; this check no longer covers what it claims"; exit 1; }
          done
          pins=$(grep -rhoE 'docker\.osgeo\.org/geoserver:[0-9.x]+' \
                   deploy/k8s/base v2/docker-compose.dynamic.yml \
                   examples/esgame-dynamic/docker-compose.yml | sort -u)
          echo "$pins"
          # Without this the check passes on nothing: `echo "" | wc -l` is 1, so an empty match
          # set looks exactly like one agreed pin, and `grep -q 'x$'` finds no rolling tag in it
          # either. A rename that stopped the grep matching would have reported success.
          if [ -z "$pins" ]; then
            echo "::error::no GeoServer pin found in any of those files; the check matched nothing"; exit 1
          fi
          if [ "$(echo "$pins" | wc -l)" -ne 1 ]; then
            echo "::error::GeoServer pins disagree across k8s and the compose stacks"; exit 1
          fi
          if echo "$pins" | grep -q 'x$'; then
            echo "::error::GeoServer is on a rolling tag; pin a specific patch"; exit 1
          fi

      - name: No run-time package installation in the R calculator
        run: |
          # calculator.r is what plumber executes on boot. It used to call
          # remotes::install_github('eblondel/geosapi') there, which cost ~31s per start,
          # pinned nothing (@HEAD), and made the container unable to start at all without
          # GitHub reachable — it died on `library(remotes)`. Dependencies belong in the
          # Dockerfile, which is where geosapi is installed now.
          # Absence assertions have to prove the file exists first, or a rename turns "nothing
          # found" into a pass. grep on a missing path exits non-zero, which reads as "clean".
          test -f tools/R/calculator.r || { echo "::error::tools/R/calculator.r is missing"; exit 1; }
          test -f tools/R/Dockerfile   || { echo "::error::tools/R/Dockerfile is missing"; exit 1; }
          if grep -nE '^[^#]*(install_github|install\.packages|install_version|install_cran)' tools/R/calculator.r; then
            echo "::error file=tools/R/calculator.r::installs a package at run time; add it to tools/R/Dockerfile instead"
            exit 1
          fi
          echo "calculator.r installs nothing at run time"

          # And the Dockerfile must actually provide geosapi, which calculator.r library()-s.
          if ! grep -qE "^[^#]*install\.packages\('geosapi'\)" tools/R/Dockerfile; then
            echo "::error file=tools/R/Dockerfile::calculator.r needs geosapi; install it here"
            exit 1
          fi
          echo "Dockerfile installs geosapi at build time"

      - name: The R sources must parse
        run: |
          # Everything else here greps calculator.r — for run-time installs, for the coverage
          # reporter, for raster_url coming from gs_public. None of that notices a syntax error,
          # so one would have surfaced only when someone built the 2.6 GB image and ran it.
          #
          # Parsing is not running: this catches a syntax error, not a wrong reclassify. That is
          # the right trade when the alternative is no gate at all. The same job exists in
          # s-gebhardt/places for its copy of this file.
          shopt -s nullglob
          files=(tools/R/*.r tools/R/*.R)
          echo "${#files[@]} R files: ${files[*]}"
          # Presence first: a rename or a moved directory would otherwise parse nothing and pass.
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::found ${#files[@]} R files under tools/R; this check is not looking at the right place"
            exit 1
          fi
          Rscript -e '
            files <- commandArgs(trailingOnly = TRUE)
            for (f in files) { invisible(parse(f)); cat("  parses:", f, "\n") }
          ' "${files[@]}"

      - name: The calculator reports how much of the allocation it actually used
        run: |
          # reclassify() ignores ids that are not in the base raster. Silently. The committed
          # copy of LU_and_NEW_hexa.tif shares 4 of 465 ids with the board, so a round against
          # it returns 200, publishes every coverage, and yields the SAME five scores for any
          # allocation — a constant this repo's own docs once quoted as a working round.
          # coverage.R turns that into a log line, so the check is that it is still wired in.
          test -f tools/R/coverage.R || { echo "::error::tools/R/coverage.R is missing"; exit 1; }
          if ! grep -q 'esgame_report_coverage(LU_hexa, map_AG)' tools/R/calculator.r; then
            echo "::error file=tools/R/calculator.r::coverage check is not called before reclassify()"; exit 1
          fi
          # And it must be sourced, or the call above is an undefined-function error at run time.
          if ! grep -q 'coverage.R' tools/R/calculator.r; then
            echo "::error file=tools/R/calculator.r::coverage.R is never sourced"; exit 1
          fi
          # The Dockerfile ships /app by COPY . . — assert coverage.R is not excluded.
          if [ -f tools/R/.dockerignore ] && grep -qE '^\s*coverage\.R\s*$' tools/R/.dockerignore; then
            echo "::error::coverage.R is excluded from the image by .dockerignore"; exit 1
          fi
          echo "allocation coverage check is wired into the calculator"

      - name: GeoServer has a separate public URL for the browser
        run: |
          # The calculator publishes coverages over GeoServer's REST API from inside the cluster
          # (GEOSERVER = the Service name) but returns WCS GetCoverage URLs that the BROWSER
          # fetches. Building those from the Service name renders, applies, and returns 200 with
          # URLs no client can resolve — which is why the geoserver Ingress exists. Verified in
          # the places stack: with the split, 6/6 coverages fetch from outside the network.
          # kustomize strips the quotes it finds in the source, so tolerate both forms.
          internal=$(grep -oP '^\s+GEOSERVER_URL:\s*"?\K[^"[:space:]]+' rendered.yaml)
          public=$(grep -oP '^\s+GEOSERVER_PUBLIC_URL:\s*"?\K[^"[:space:]]+' rendered.yaml)
          echo "internal=$internal"
          echo "public=$public"
          if [ -z "$internal" ]; then
            echo "::error::GEOSERVER_URL is missing from the ConfigMap"; exit 1
          fi
          if [ -z "$public" ]; then
            echo "::error::GEOSERVER_PUBLIC_URL is missing from the ConfigMap"; exit 1
          fi
          if [ "$internal" = "$public" ]; then
            echo "::error::GEOSERVER_PUBLIC_URL equals the in-cluster GEOSERVER_URL; the browser cannot resolve a Service name"; exit 1
          fi
          if grep -q 'esgame-geoserver-service' <<<"$public"; then
            echo "::error::GEOSERVER_PUBLIC_URL points at the Service; use the geoserver ingress host"; exit 1
          fi
          # And the calculator container must actually receive it, or the ConfigMap value is inert.
          if ! grep -q 'GEOSERVER_PUBLIC_URL' deploy/k8s/base/calculation-deployment.yaml; then
            echo "::error file=deploy/k8s/base/calculation-deployment.yaml::GEOSERVER_PUBLIC_URL is not wired into the calculation container"; exit 1
          fi
          # The R calculator must build its URLs from it rather than from GEOSERVER.
          if ! grep -qE '^\s*raster_url\s*<-\s*paste0\(\s*gs_public' tools/R/calculator.r; then
            echo "::error file=tools/R/calculator.r::raster_url must be built from gs_public (GEOSERVER_PUBLIC_URL), not gs_url"; exit 1
          fi
          echo "GeoServer public URL is separate, wired through, and used for coverage URLs"

      - name: ghcr images must use a tag some workflow actually publishes
        run: |
          # The base pointed at ghcr.io/mlacayoemery/esgame-calculation:latest while the
          # publishing workflow tags with the branch, the semver and the sha — so `latest` was
          # a tag nothing ever pushed. Nothing here pulls these images, so the mistake could
          # only surface as ErrImagePull in someone's cluster.
          #
          # Both images roll on `master`. Assert that, and assert the workflows that produce
          # them still emit a branch tag, so this does not quietly stop meaning anything.
          bad=0
          imgs=$(grep -oP '^\s+image:\s*\Kghcr\.io/\S+' rendered.yaml || true)
          n=$(printf '%s\n' "$imgs" | grep -c . || true)
          echo "$imgs"
          if [ "$n" -ne 2 ]; then
            echo "::error::expected 2 ghcr images in the render, found $n"; exit 1
          fi
          for i in $imgs; do
            case "$i" in
              *:master) ;;
              *) echo "::error::$i does not use the :master tag the workflows publish"; bad=1 ;;
            esac
          done
          for w in .github/workflows/image.yml .github/workflows/image-calculation.yml; do
            [ -e "$w" ] || { echo "::error::$w is gone; nothing publishes that image"; bad=1; continue; }
            grep -q 'type=ref,event=branch' "$w" \
              || { echo "::error::$w no longer emits a branch tag, so :master is not published"; bad=1; }
          done
          [ "$bad" = 0 ] && echo "both ghcr images use a tag their workflow publishes"
          exit $bad

      - name: Browser-facing URLs must name a host an Ingress serves
        run: |
          # The check above asks whether GEOSERVER_PUBLIC_URL differs from the in-cluster
          # Service URL. That is weaker than the question that matters: does it name a host an
          # Ingress in the same render actually answers for? And CALC_URL — where the browser
          # POSTs the allocation — was not checked at all.
          #
          # The places overlay, which consumes this base, shipped a CALC_URL pointing at a host
          # from a different deployment while every check there passed. It rendered, it would
          # have applied, and it would have failed only in a browser.
          #
          # This also renders the local-registry overlay, which nothing in CI rendered before.
          #
          # The render step above extracts kustomize into the workspace root rather than onto
          # PATH; the script looks it up by name so it works the same way when run by hand.
          export PATH="${GITHUB_WORKSPACE}:${PATH}"
          ./deploy/k8s/render-test.sh

      - name: Ingress hosts must be valid RFC 1123 subdomains
        run: |
          # kubeconform does not check this: a host is just a string in the schema, so
          # CHANGE-ME-esgame.example.com passed strict validation and was then rejected by
          # the API server ("must be a lowercase RFC 1123 subdomain"), making
          # `kubectl apply -k deploy/k8s/base` fail on all three ingresses. Uppercase in a
          # placeholder is enough to break it, and the error talks about regexes rather
          # than about setting your host.
          hosts=$(grep -oP '^\s+- host:\s*\K\S+' rendered.yaml)
          echo "$hosts"
          # The loop below examines whatever it is given, so with no hosts it examines nothing
          # and reports success — the same shape as the pin check. The base renders three
          # Ingresses; if it stops rendering them, that is the failure, not a clean run.
          n=$(printf '%s\n' "$hosts" | grep -c . || true)
          if [ "$n" -ne 3 ]; then
            echo "::error::expected 3 ingress hosts in the render, found $n"; exit 1
          fi
          bad=0
          for h in $hosts; do
            if ! printf '%s' "$h" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'; then
              echo "::error::ingress host '$h' is not a valid RFC 1123 subdomain; the API server will reject it"
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "all ingress hosts are RFC 1123 valid"
          exit $bad

  # Separate job so the fast checks above are not held up by cluster startup (~40s).
  server-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start a throwaway cluster
        run: |
          curl -sSfL -o kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x kind
          ./kind create cluster --name validate --wait 120s

      - name: kubectl apply --dry-run=server
        run: |
          # The real API server, so admission and field validation both apply. This is what
          # catches what the schema cannot — see the note at the top of this file.
          kubectl apply --dry-run=server -k deploy/k8s/base

      - name: Apply for real, and check what should actually come up
        run: |
          # The base intentionally has no default GeoServer password: the deployments
          # reference a Secret that does not exist in-repo, so a missing one fails the
          # rollout instead of quietly shipping admin/geoserver. Create a throwaway here.
          kubectl create secret generic esgame-geoserver-admin \
            --from-literal=username=admin \
            --from-literal=password="ci-only-$(head -c 16 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          kubectl apply -k deploy/k8s/base
          # esgame-angular and esgame-geoserver use published images and must become ready.
          # esgame-calculation is deliberately excluded: its image is documented as
          # build-it-yourself, so it will never pull here.
          for d in esgame-angular esgame-geoserver; do
            kubectl rollout status "deploy/$d" --timeout=180s
          done
          # A Service with a selector that matches nothing still creates cleanly, so assert
          # the endpoints actually populated.
          for s in esgame-angular-service esgame-geoserver-service; do
            n=$(kubectl get endpointslice -l "kubernetes.io/service-name=$s" \
                  -o jsonpath='{.items[*].endpoints[*].addresses[*]}' | wc -w)
            [ "$n" -ge 1 ] || { echo "::error::$s has no endpoints; its selector matches no pod"; exit 1; }
            echo "$s -> $n endpoint(s)"
          done

      - name: The runtime config substitution reaches the container
        run: |
          # The deployment's premise is that one image serves any backend by env var alone:
          # the entrypoint injects CALC_URL into assets/config.json at start. Assert it,
          # rather than trusting the ConfigMap was merely mounted.
          want=$(kubectl get cm esgame-config -o jsonpath='{.data.CALC_URL}')
          got=$(kubectl exec deploy/esgame-angular -- sh -c 'cat /usr/share/nginx/html/assets/config.json' \
                  | sed -n 's/.*"calcUrl"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          echo "ConfigMap CALC_URL: $want"
          echo "config.json calcUrl: $got"
          [ "$want" = "$got" ] || { echo "::error::CALC_URL was not substituted into assets/config.json"; exit 1; }

      - name: Tear down
        if: always()
        run: ./kind delete cluster --name validate || true
