name: Validate deploy artifacts

# deploy/k8s had one commit and no gate: it was added, never re-run, and drifted
# (GeoServer stayed on a rolling 2.24.x tag while both compose stacks moved to 2.28.4).
# This renders the Kustomize base and schema-checks the result, so drift and typos fail
# a PR instead of waiting for someone to apply them to a real cluster.
on:
  pull_request:
    paths: ['deploy/**', 'tools/R/**', '.github/workflows/manifests.yml']
  push:
    branches: [master]
    paths: ['deploy/**', 'tools/R/**', '.github/workflows/manifests.yml']
  schedule:
    # Mondays 06:20 UTC, offset from the CI job so both do not start at once.
    - cron: '20 6 * * 1'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render the Kustomize base
        run: |
          curl -sSfL -o kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          ./kustomize build deploy/k8s/base > rendered.yaml
          echo "rendered $(grep -c '^kind:' rendered.yaml) resources"

      - name: Schema-check against the Kubernetes API
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml

      - name: Check the GeoServer pin matches the compose stacks
        run: |
          # One version of GeoServer across k8s and both compose files, and never a
          # rolling tag — the drift this workflow exists to catch.
          pins=$(grep -rhoE 'docker\.osgeo\.org/geoserver:[0-9.x]+' \
                   deploy/k8s/base v2/docker-compose.dynamic.yml \
                   examples/esgame-dynamic/docker-compose.yml | sort -u)
          echo "$pins"
          if [ "$(echo "$pins" | wc -l)" -ne 1 ]; then
            echo "::error::GeoServer pins disagree across k8s and the compose stacks"; exit 1
          fi
          if echo "$pins" | grep -q 'x$'; then
            echo "::error::GeoServer is on a rolling tag; pin a specific patch"; exit 1
          fi

      - name: No run-time package installation in the R calculator
        run: |
          # calculator.r is what plumber executes on boot. It used to call
          # remotes::install_github('eblondel/geosapi') there, which cost ~31s per start,
          # pinned nothing (@HEAD), and made the container unable to start at all without
          # GitHub reachable — it died on `library(remotes)`. Dependencies belong in the
          # Dockerfile, which is where geosapi is installed now.
          if grep -nE '^[^#]*(install_github|install\.packages|install_version|install_cran)' tools/R/calculator.r; then
            echo "::error file=tools/R/calculator.r::installs a package at run time; add it to tools/R/Dockerfile instead"
            exit 1
          fi
          echo "calculator.r installs nothing at run time"

          # And the Dockerfile must actually provide geosapi, which calculator.r library()-s.
          if ! grep -qE "^[^#]*install\.packages\('geosapi'\)" tools/R/Dockerfile; then
            echo "::error file=tools/R/Dockerfile::calculator.r needs geosapi; install it here"
            exit 1
          fi
          echo "Dockerfile installs geosapi at build time"

      - name: Ingress hosts must be valid RFC 1123 subdomains
        run: |
          # kubeconform does not check this: a host is just a string in the schema, so
          # CHANGE-ME-esgame.example.com passed strict validation and was then rejected by
          # the API server ("must be a lowercase RFC 1123 subdomain"), making
          # `kubectl apply -k deploy/k8s/base` fail on all three ingresses. Uppercase in a
          # placeholder is enough to break it, and the error talks about regexes rather
          # than about setting your host.
          hosts=$(grep -oP '^\s+- host:\s*\K\S+' rendered.yaml)
          echo "$hosts"
          bad=0
          for h in $hosts; do
            if ! printf '%s' "$h" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'; then
              echo "::error::ingress host '$h' is not a valid RFC 1123 subdomain; the API server will reject it"
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "all ingress hosts are RFC 1123 valid"
          exit $bad
