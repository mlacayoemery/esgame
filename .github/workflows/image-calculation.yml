name: Build & publish the calculation image

# Publishes the R/Plumber calculation backend to GitHub Container Registry.
# Image: ghcr.io/<owner>/esgame-calculation  (branch, semver and commit-sha tags)
#
# This is the image deploy/k8s/base already names. Until now nothing built it, so
# `kubectl apply -k deploy/k8s/base` produced a permanent ErrImagePull on the calculation pod
# and every local test had to run its own registry to have anything to pull. That was the
# largest entry under "Known incomplete" in docs/verification-status.rst.
#
# Kept separate from image.yml rather than added as a second job:
#   * different trigger paths — the frontend rebuilds on v2/**, this on tools/R/**
#   * ~15 minutes against the frontend's ~2, so sharing a workflow would make every frontend
#     publish look slow and would couple two unrelated failures

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'tools/R/**'
      - '.github/workflows/image-calculation.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The image installs eleven R packages from source against GDAL/PROJ/GEOS. 15 minutes is
    # normal for a cold build; the default 360 is long enough to hide a hang for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        # The image is ~2.6 GB and the build needs several times that in layers. A runner
        # arrives with ~25 GB free, and "no space left on device" here surfaces as an
        # unrelated-looking R compile error partway through.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-calculation
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: tools/R
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA layer cache on purpose. The image is ~2.6 GB, the repository-wide Actions
          # cache is 10 GB, and mode=max would store every intermediate layer — evicting the
          # caches other workflows depend on to save time on a build that only runs when
          # tools/R changes, which is rarely.

      - name: The published image must actually answer
        # A push proves bytes were uploaded, not that the thing runs. The Dockerfile's own
        # verification layers check that the R packages load at BUILD time; this checks the
        # published artefact starts and serves, which is what the cluster will do with it.
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)
          echo "probing ${tag}"

          # THE BASE RASTER IS MOUNTED, and has to be. tools/R/Dockerfile creates /app/data empty
          # because in the cluster an init container fills it, and since 2026-08-14 calculator.r
          # checks ESGAME_BASE_RASTER exists at STARTUP rather than failing on the first round — so
          # a bare `docker run` of this image now exits immediately, by design.
          #
          # That check is also why this probe is worth more than it was. It used to run the image
          # with no geodata and accept any HTTP status, on the grounds that "with no geodata mounted
          # it cannot score a real round" — which meant it passed against a container that would
          # have 500'd on every request a player made. A probe that cannot fail for the reason the
          # thing is used is not a probe.
          docker run -d --name calc -p 8000:8000 \
            -e ESGAME_BASE_RASTER=LU_and_NEW_hexa.tif \
            -e GEOSERVER_USER=probe -e GEOSERVER_PASSWORD=probe \
            -v "${PWD}/v2/src/assets/images/LU_and_NEW_hexa.tif:/app/data/LU_and_NEW_hexa.tif:ro" \
            "${tag}"

          # Plumber takes ~12s to bind. Poll rather than sleep-and-hope: a fixed sleep that is
          # too short reads as "the image is broken". There is no /health route, so the test is
          # simply whether anything answers — a refused connection gives 000, while a running
          # plumber gives 404 for an unrouted path. Those are the two states worth telling
          # apart; the next step decides whether what answered is really the calculator.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            if [ "${code}" != 000 ]; then ok=1; echo "answered ${code} after ${i} attempts"; break; fi
            sleep 2
          done

          if [ "${ok:-0}" != 1 ]; then
            echo "::error::the published image never accepted a connection on :8000"
            docker logs calc || true
            exit 1
          fi

          # It answered. Now check it is the calculator and not merely something listening:
          # POST an empty allocation and require a structured refusal rather than a crash.
          code=$(curl -s -o body.txt -w '%{http_code}' --max-time 60 \
            -X POST http://127.0.0.1:8000/esgame \
            -H 'Content-Type: application/json' -d '{"allocation":[]}' || true)
          echo "POST /esgame -> ${code}"
          head -c 400 body.txt || true
          echo
          # 400 exactly, not "anything but 000". An empty allocation is one calculator.r explicitly
          # refuses, with a message naming what was wrong, and that is a much narrower claim than
          # "something answered": 500 would mean it died in the model, and 200 would mean it scored
          # a round it should have rejected.
          if [ "${code}" != 400 ]; then
            echo "::error::POST /esgame with an empty allocation returned ${code}, expected 400"
            docker logs calc || true
            exit 1
          fi
          grep -q "'allocation' is empty" body.txt || {
            echo "::error::the 400 did not say why; the refusal is supposed to be actionable"
            cat body.txt
            exit 1
          }

          # The startup line naming the board it loaded. Without this the mount above could silently
          # stop working — the container would refuse to start, the poll would fail, and the error
          # would point at the network rather than at the missing file.
          docker logs calc 2>&1 | grep -q 'base raster: LU_and_NEW_hexa.tif' || {
            echo "::error::the calculator never logged which base raster it loaded"
            docker logs calc || true
            exit 1
          }
          docker rm -f calc >/dev/null

      - name: ...and must refuse to start without one
        # The other half of the check above, and the half that rots: if calculator.r ever stopped
        # verifying its base raster, every test here would still pass while a misconfigured
        # deployment went back to answering health checks and 500ing every round — which is exactly
        # the state the dynamic compose stack was in for months.
        #
        # TWO ways to have no board, and both must be refused. ESGAME_BASE_RASTER has no default
        # since 2026-08-15: a deployment that does not say which board it serves would otherwise be
        # handed one, come up healthy, and score against a board the browser may not be drawing.
        run: |
          set -uo pipefail
          tag=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)

          # (a) nothing said at all
          if docker run --rm --name calc-unset -e GEOSERVER_USER=probe -e GEOSERVER_PASSWORD=probe \
               "${tag}" > unset.log 2>&1; then
            echo "::error::the calculator started with ESGAME_BASE_RASTER unset; it should refuse"
            head -c 800 unset.log
            exit 1
          fi
          grep -q 'ESGAME_BASE_RASTER is not set' unset.log || {
            echo "::error::it refused, but not for the reason it should have:"
            head -c 800 unset.log
            exit 1
          }
          echo "unset: refused, as it should"

          # (b) a board named that is not there
          if docker run --rm --name calc-nodata -e ESGAME_BASE_RASTER=LU_and_NEW_hexa.tif \
               -e GEOSERVER_USER=probe -e GEOSERVER_PASSWORD=probe \
               "${tag}" > nodata.log 2>&1; then
            echo "::error::the calculator started with no base raster on disk; it should refuse"
            head -c 800 nodata.log
            exit 1
          fi
          grep -q 'does not exist' nodata.log || {
            echo "::error::it refused, but not for the reason it should have:"
            head -c 800 nodata.log
            exit 1
          }
          echo "named but absent: refused, as it should"

          # (c) a board, but no credential to publish with. Guessing admin/geoserver is what let a
          # calculator aimed at the wrong host keep trying instead of failing.
          if docker run --rm --name calc-nocreds -e ESGAME_BASE_RASTER=LU_and_NEW_hexa.tif \
               -v "${PWD}/v2/src/assets/images/LU_and_NEW_hexa.tif:/app/data/LU_and_NEW_hexa.tif:ro" \
               "${tag}" > nocreds.log 2>&1; then
            echo "::error::the calculator started with no GeoServer credentials; it should refuse"
            head -c 800 nocreds.log
            exit 1
          fi
          grep -q 'GEOSERVER_USER and GEOSERVER_PASSWORD not set' nocreds.log || {
            echo "::error::it refused, but not for the reason it should have:"
            head -c 800 nocreds.log
            exit 1
          }
          echo "no credentials: refused, as it should"

      - name: Say what was published
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            printf '%s\n' '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
