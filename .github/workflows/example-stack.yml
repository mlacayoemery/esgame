name: The compose stacks come up

# examples/esgame-dynamic is the "clone it and run it" stack, and nothing ever ran it. That mattered
# on 2026-08-14, when both compose files were pointed at a GeoServer image this repository builds
# itself — a change whose whole risk is at container start, and which no CI job could have exercised.
#
# WHAT THIS DOES NOT COVER, stated because the gap is easy to assume away: it brings the stack up on
# a FRESH volume, and the hazard that actually bit during that change needs an EXISTING one. A docker
# named volume populates from the image on first use, ownership included, so a volume created by the
# old root image holds root-owned 0755 content that uid 10001 cannot write — GeoServer then serves
# 404 while logging no permission error at all. A fresh-volume run populates correctly and says
# nothing about that. The upgrade path is documented in the compose file instead.
#
# v2/docker-compose.dynamic.yml is run too, in a SECOND job, and only on a schedule: it builds
# both the frontend AND the R calculator from source, and the calculator alone is ~15 minutes
# (eleven R packages against GDAL). That is too much for a pull-request gate and is why this used
# to only parse it. The parse stays in the per-PR job, since it costs seconds and catches a typo.

on:
  pull_request:
    paths:
      - 'examples/esgame-dynamic/**'
      - 'v2/docker-compose*.yml'
      - 'deploy/geoserver/**'
      - '.github/workflows/example-stack.yml'
  push:
    branches: [master]
    paths:
      - 'examples/esgame-dynamic/**'
      - 'v2/docker-compose*.yml'
      - 'deploy/geoserver/**'
      - '.github/workflows/example-stack.yml'
  schedule:
    # Mondays, with the rest. The path filters above mean this can go a long time without running,
    # and both images it pulls roll on `:master` — so a scheduled run is what catches the stack
    # breaking because something it depends on moved rather than because this repository changed.
    - cron: '50 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Explicit and non-default: a runner with anything already on 8080 fails at `up` with
      # "Bind for 0.0.0.0:8080 failed", which is what happened running this by hand. The
      # calculator's GEOSERVER_PUBLIC_URL is derived from this, so the two stay consistent.
      ESGAME_GEOSERVER_PORT: '18080'
      COMPOSE: docker compose -p esgame-example -f examples/esgame-dynamic/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        # The GeoServer image alone is 1.77 GB and the frontend base is pulled on top of it.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      - name: The other compose file at least parses
        # v2/docker-compose.dynamic.yml is an OVERRIDE — `esgame-core` is defined in the base file,
        # so parsing it alone fails with "has neither an image nor a build context specified".
        # Both together is how it is used and how it must resolve.
        run: |
          set -euo pipefail
          docker compose -f v2/docker-compose.yml -f v2/docker-compose.dynamic.yml config \
            | grep -qE 'esgame-geoserver:master' \
            || { echo "::error::v2 compose does not resolve to the esgame-geoserver image"; exit 1; }
          echo "v2 compose resolves"

      - name: Bring the example up
        # No ESGAME_IMAGE, so the frontend builds FROM the published esgame image rather than
        # compiling Angular here.
        run: ${{ env.COMPOSE }} up -d --build

      - name: GeoServer serves, as a non-root uid, having written its own catalog
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:${ESGAME_GEOSERVER_PORT}/geoserver/index.html" || true)
            if [ "$code" = 200 ]; then ok=1; echo "geoserver answered 200 after $((i*3))s"; break; fi
            sleep 3
          done
          if [ "${ok:-0}" != 1 ]; then
            echo "::error::GeoServer never served /geoserver/index.html"
            docker logs esgame-dynamic-geoserver 2>&1 | tail -40
            exit 1
          fi

          uid=$(docker exec esgame-dynamic-geoserver id -u)
          echo "uid: ${uid}"
          [ "${uid}" != 0 ] || { echo "::error::GeoServer is running as root"; exit 1; }

          # The interesting failure is a writability one, and it does NOT appear as "permission
          # denied" — GeoServer logs it as a WARN about its data dir and then serves 404s.
          bad=$(docker logs esgame-dynamic-geoserver 2>&1 \
                | grep -ciE 'permission denied|not writeable' || true)
          echo "writability complaints: ${bad}"
          [ "${bad}" = 0 ] || {
            echo "::error::GeoServer could not write something; its catalog is not trustworthy"
            docker logs esgame-dynamic-geoserver 2>&1 | grep -iE 'permission denied|not writeable' | head
            exit 1
          }

      - name: The seeder registered the coverages
        # This is the assertion that needs GeoServer to be WRITABLE — the seeder drives its REST
        # API to create a workspace and eight coverage stores. Serving 200 proves reads.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' esgame-dynamic-geoserver-seed)
            case "$st" in exited:*) break ;; esac
            sleep 3
          done
          echo "seeder: ${st}"
          [ "$st" = "exited:0" ] || {
            echo "::error::the seeder did not finish cleanly (${st})"
            docker logs esgame-dynamic-geoserver-seed 2>&1 | tail -30; exit 1
          }
          ws=$(curl -s -u admin:geoserver \
                 "http://127.0.0.1:${ESGAME_GEOSERVER_PORT}/geoserver/rest/workspaces.json")
          echo "$ws" | grep -q '"esgame"' || {
            echo "::error::the esgame workspace is not in GeoServer's catalog"
            echo "$ws" | head -c 400; exit 1
          }
          echo "esgame workspace present"

      - name: The frontend and calculator answer
        run: |
          set -euo pipefail
          for name in "frontend http://127.0.0.1:81/" "calculator http://127.0.0.1:8000/"; do
            set -- $name
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$2" || true)
            echo "$1 -> $code"
            [ "$code" = 200 ] || { echo "::error::$1 answered $code, not 200"; exit 1; }
          done

      - name: What the stack looked like if any of that failed
        if: failure()
        run: |
          ${{ env.COMPOSE }} ps || true
          for c in esgame-dynamic-geoserver esgame-dynamic-geoserver-seed \
                   esgame-dynamic-calculator esgame-dynamic-frontend; do
            echo "=== $c ==="; docker logs "$c" 2>&1 | tail -30 || true
          done

      - name: Tear down
        if: always()
        run: ${{ env.COMPOSE }} down -v || true

  # The stack a developer gets from `make esgame-dynamic-up`, which nothing ran either.
  #
  # SCHEDULE AND DISPATCH ONLY. It builds the frontend and the R calculator from source; the
  # calculator is ~15 minutes on its own. The example stack above covers the same SHAPE far more
  # cheaply by pulling published images and a FastAPI stand-in, so what this adds is the real
  # calculator and the real Angular build wired together by compose — worth having weekly, not
  # worth it on every pull request.
  v2-stack:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Non-default ports throughout: 8080 is a common occupant and `up` fails with an opaque
      # "Bind for 0.0.0.0:8080 failed" if anything holds it.
      ESGAME_FRONTEND_PORT: '8191'
      ESGAME_CALC_PORT: '8192'
      ESGAME_GEOSERVER_PORT: '8193'
      COMPOSE: docker compose -p esgame-v2 -f v2/docker-compose.yml -f v2/docker-compose.dynamic.yml
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        # The calculator image is ~2.6 GB and GeoServer is 1.77 GB.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      - name: Build and start the dynamic stack
        run: ${{ env.COMPOSE }} up -d --build

      - name: The frontend serves, with CALC_URL injected at container start
        # The premise of the whole deployment: one image, retargeted by env var at start rather
        # than by rebuilding. The compose overlay sets CALC_URL from ESGAME_CALC_PORT, so this
        # also catches the two drifting apart — a stack that comes up clean and fails only in a
        # browser, which is the failure ingress-test.sh guards against on the k8s side.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ESGAME_FRONTEND_PORT}/" || true)
            [ "$code" = 200 ] && { ok=1; echo "frontend answered 200 after $((i*3))s"; break; }
            sleep 3
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::the frontend never served"; docker logs esgame-core 2>&1 | tail -30; exit 1; }

          got=$(curl -s "http://127.0.0.1:${ESGAME_FRONTEND_PORT}/assets/config.json" \
                  | python3 -c 'import sys,json; print(json.load(sys.stdin).get("calcUrl",""))')
          want="http://localhost:${ESGAME_CALC_PORT}"
          echo "calcUrl served: ${got}   expected: ${want}"
          [ "$got" = "$want" ] || { echo "::error::CALC_URL did not reach the served config"; exit 1; }

      - name: The calculator is the calculator, not merely something listening
        # Plumber binds ~12s after the container starts, so this polls. An unrouted path gives 404
        # once it is up and 000 while it is not — those are the two states worth telling apart.
        # Then POST an empty allocation: any HTTP status is fine, but it must REFUSE structurally
        # rather than die, which is what 000 on the second request would mean.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:${ESGAME_CALC_PORT}/" || true)
            [ "$code" != 000 ] && { ok=1; echo "calculator answered ${code} after $((i*3))s"; break; }
            sleep 3
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::the calculator never accepted a connection"; docker compose -p esgame-v2 logs esgame-calculator 2>&1 | tail -30; exit 1; }

          code=$(curl -s -o body.txt -w '%{http_code}' --max-time 120 \
            -X POST "http://127.0.0.1:${ESGAME_CALC_PORT}/esgame" \
            -H 'Content-Type: application/json' -d '{"allocation":[],"round":1,"game_id":"ci"}' || true)
          echo "POST /esgame -> ${code}"; head -c 300 body.txt || true; echo
          [ "$code" != 000 ] || { echo "::error::the calculator died handling a request"; exit 1; }

      - name: GeoServer serves, non-root
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ESGAME_GEOSERVER_PORT}/geoserver/index.html" || true)
            [ "$code" = 200 ] && { ok=1; echo "geoserver answered 200 after $((i*3))s"; break; }
            sleep 3
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::GeoServer never served"; exit 1; }
          uid=$(docker compose -p esgame-v2 exec -T esgame-geoserver id -u | tr -d '\r')
          echo "uid: ${uid}"
          [ "${uid}" != 0 ] || { echo "::error::GeoServer is running as root"; exit 1; }

      - name: What the stack looked like if any of that failed
        if: failure()
        run: ${{ env.COMPOSE }} ps || true; ${{ env.COMPOSE }} logs --tail 40 || true

      - name: Tear down
        if: always()
        run: ${{ env.COMPOSE }} down -v || true
