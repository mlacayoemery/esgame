name: CI

# Build + unit + e2e + Lighthouse gate for the v2 app.
#
# The path filter keeps PRs fast, but it is also how this gate once stayed red for
# seven weeks unnoticed: CI never ran on the docs and examples PRs that were merged
# during that period, so nothing reported the failure. The weekly schedule exists to
# close that hole — master gets exercised whether or not anyone touches v2/, and
# breakage that arrives from outside the repo (a runner image change, a deprecated
# action, a new advisory) surfaces on its own.
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/ci.yml']
  push:
    branches: [master]
    paths: ['v2/**', '.github/workflows/ci.yml']
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      # Google Chrome is preinstalled on ubuntu-latest; Playwright (channel: chrome) uses it
      # for the e2e suite. Unit tests run under vitest + jsdom and need no browser.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Newest Node that Angular 22's CLI accepts (^22.22.3 || ^24.15.0 || >=26.0.0).
          # Keep in sync with deploy.yml so the gate matches what ships.
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Unit tests
        run: npm test -- --watch=false

      - name: E2E (Playwright)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7

      # Bundle-size + Core Web Vitals gate. The Angular `initial` budget only warns,
      # so this is what actually fails a regression. Reuses e2e/serve.mjs, which matches
      # the container's nginx: SPA fallback for routes, a real 404 for a missing asset.
      - name: Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run lhci

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: v2/.lighthouseci/reports
          retention-days: 7

      # Scheduled runs only: a new advisory against a shipped dependency should surface
      # on its own, but should not block an unrelated PR that happens to be open when it
      # lands. Production dependencies are at 0 — this defends that.
      - name: Production dependency audit
        if: github.event_name == 'schedule'
        run: npm audit --omit=dev --audit-level=high
