name: CI

# Build + unit + e2e + Lighthouse gate for the v2 app.
#
# The path filter keeps PRs fast, but it is also how this gate once stayed red for
# seven weeks unnoticed: CI never ran on the docs and examples PRs that were merged
# during that period, so nothing reported the failure. The weekly schedule exists to
# close that hole — master gets exercised whether or not anyone touches v2/, and
# breakage that arrives from outside the repo (a runner image change, a deprecated
# action, a new advisory) surfaces on its own.
#
# docs/verification-status.rst is in the filter because two steps below READ IT: they compare
# the unit and e2e counts it claims against what the suite actually ran. A filter of `v2/**`
# alone meant those checks could not run on a change to their own input — a documentation-only
# pull request could put any number in that line and merge green. Same shape as the doc-path
# check moved out in #191, and the fix is the opposite one: that check needed no build, so it
# left; these need the suite output, so the trigger comes to them. ~2 minutes, and that file
# changes on most pull requests here, so in practice CI now runs on nearly all of them. That is
# the cost of the claims being checked against a run rather than against nothing.
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/ci.yml', 'docs/verification-status.rst']
  push:
    branches: [master]
    paths: ['v2/**', '.github/workflows/ci.yml', 'docs/verification-status.rst']
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      # Google Chrome is preinstalled on ubuntu-latest; Playwright (channel: chrome) uses it
      # for the e2e suite. Unit tests run under vitest + jsdom and need no browser.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Newest Node that Angular 22's CLI accepts (^22.22.3 || ^24.15.0 || >=26.0.0).
          # Keep in sync with deploy.yml so the gate matches what ships.
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Unit tests
        run: |
          # set -o pipefail, or `| tee` masks a failing suite: the pipeline's status would be
          # tee's. That is the same shape as the vacuous checks fixed in #111-#115.
          set -o pipefail
          npm test -- --watch=false 2>&1 | tee /tmp/unit.log

      - name: The documented test count is current
        run: |
          # docs/verification-status.rst claims a unit-test count as evidence of coverage. It
          # said 135 while the suite was at 255 — true when written, never re-derived. A claim
          # nothing re-measures drifts, so this re-measures it.
          actual=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/unit.log | grep -oE 'Tests +[0-9]+ passed' | grep -oE '[0-9]+' | head -1)
          # Anchored to the table row, not any mention: the prose above it discusses a stale
          # "135 unit tests" and an unanchored grep matched THAT, so the first version of this
          # check compared the suite against a number quoted in a story about staleness.
          claimed=$(grep -oE '^\s+- [0-9]+ unit tests,' ../docs/verification-status.rst | grep -oE '[0-9]+' | head -1)
          echo "suite reports: ${actual:-<none>}   docs claim: ${claimed:-<none>}"
          # Both must be found, or the check is measuring nothing.
          if [ -z "$actual" ]; then
            echo "::error::could not read the test count from the suite output"; exit 1
          fi
          if [ -z "$claimed" ]; then
            echo "::error file=docs/verification-status.rst::no '<n> unit tests' claim found to check"; exit 1
          fi
          if [ "$actual" != "$claimed" ]; then
            echo "::error file=docs/verification-status.rst::says $claimed unit tests, the suite runs $actual — update it"
            exit 1
          fi
          echo "documented count matches the suite"

      # "Every file the verification doc points at must exist" used to live here. It has moved to
      # .github/workflows/doc-paths.yml, unchanged in substance, because this workflow is
      # path-filtered to `v2/**` and the file it validates is under `docs/` — so it could not run
      # on the change most likely to break it, and #189 broke it exactly that way. The new
      # workflow has no path filter, which is what the check actually needs.

      - name: E2E (Playwright)
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee /tmp/e2e.log

      - name: The documented e2e count is current
        run: |
          # The doc claims an e2e count beside the unit one, and only the unit one was checked.
          actual=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
          claimed=$(grep -oE '^\s+- [0-9]+ unit tests, [0-9]+ Playwright e2e' "${GITHUB_WORKSPACE}/docs/verification-status.rst" \
                    | grep -oE '[0-9]+ Playwright' | grep -oE '[0-9]+')
          echo "suite reports: ${actual:-<none>}   docs claim: ${claimed:-<none>}"
          if [ -z "$actual" ] || [ -z "$claimed" ]; then
            echo "::error::could not read one of the e2e counts (suite='${actual}', docs='${claimed}')"; exit 1
          fi
          if [ "$actual" != "$claimed" ]; then
            echo "::error file=docs/verification-status.rst::says $claimed Playwright e2e, the suite runs $actual — update it"
            exit 1
          fi
          echo "documented e2e count matches the suite"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7

      # Bundle-size + Core Web Vitals gate. The Angular `initial` budget only warns,
      # so this is what actually fails a regression. Reuses e2e/serve.mjs, which matches
      # the container's nginx: SPA fallback for routes, a real 404 for a missing asset.
      - name: Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run lhci

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: v2/.lighthouseci/reports
          retention-days: 7

  # Dependency advisories.
  #
  # Scheduled and on-demand, not per-PR: a new advisory should surface on its own, but should
  # not block an unrelated pull request that happens to be open when it lands. That much was
  # already true. Two things about it were not.
  #
  # It is a JOB now, not the last step of build-test. There it ran only once the build, both
  # suites and Lighthouse had all passed — so a flaky e2e or a Lighthouse blip on a Monday took
  # the audit with it, silently, and the run was red for a reason that had nothing to do with
  # dependencies. `npm audit` reads package-lock.json: it needs no `npm ci`, no build and no
  # browser, so it has no business waiting behind ten minutes of work it does not use.
  #
  # And it covers the dev tree. See "The dependency audit" in docs/verification-status.rst.
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Pinned to build-test's Node so both see the same npm and the same audit behaviour.
          # No `cache: npm`, because nothing here installs.
          node-version: 26.5.0

      # Split in two so the failure says which tree, and neither hides the other: production is
      # the stricter invariant — it is what reaches the browser — and it has been at 0 since
      # this existed. Without the `if:`, a production finding would skip the dev report entirely.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit, including the build toolchain
        # tools/audit.sh rather than `npm audit --audit-level=high` since 2026-08-14: one advisory
        # in this tree is unfixable at any version (extract-zip, vulnerable range `*`, reached
        # through @lhci/cli). The choices were a permanently red Monday, dropping the Lighthouse
        # gate, or scoping this one — and scoping it with `continue-on-error` would have meant the
        # NEXT dev advisory also landed in a green run. The script fails on anything not
        # explicitly accepted, and on an accepted entry that no longer applies. See
        # "The dependency audit" in docs/verification-status.rst.
        if: ${{ !cancelled() }}
        working-directory: .
        run: tools/audit.sh
