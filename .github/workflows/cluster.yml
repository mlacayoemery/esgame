name: Cluster round-trip

# The strongest checks in this repository are the ones nothing ran:
# deploy/k8s/ingress-test.sh and v2/e2e-cluster both need a cluster with ingress-nginx, so they
# only ever executed when someone executed them by hand. That gap is written up under
# "Not verified" in docs/verification-status.rst.
#
# STILL NOT A BLANKET PR GATE, and for the reason that has always been written here: both images
# roll on :master, so this tests "master's images against master's manifests". On a pull request
# that changes v2 or tools/R, the images it would pull do NOT contain the change — it would answer
# a question the PR did not ask, and answer it wrong in both directions.
#
# But waiting until Monday to learn that master cannot deploy is its own defect. So it runs at the
# two moments the question is meaningful, and not otherwise:
#
#   workflow_run    after an image is PUBLISHED from master. This is the ordering trap this
#                   repository has hit before: an image build takes ~15 minutes, so a run started
#                   at merge would pull the PREVIOUS image and test the wrong thing. Waiting for
#                   the publish to finish is what makes "master's images against master's
#                   manifests" true rather than approximately true.
#
#   pull_request    only for deploy/k8s/**. A manifest-only change is exactly the case where
#                   master's images ARE the right images to test against, so here the PR gate
#                   asks precisely the question the PR raises.
#
# The schedule stays, because it also catches the world drifting under a repository that did not
# change: an upstream ingress-nginx release, a base image rebuild, a GeoServer tag moving.
#
# A flaky gate is worse than an honest gap, and that has not stopped being true — the pull_request
# trigger is deliberately narrow so that the gate people must pass is the one they can act on.

on:
  schedule:
    # Mondays, after ci.yml (06:00) and manifests.yml (06:20), so a failure here is read against
    # a known-good build rather than alongside one.
    - cron: '40 6 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Build & publish container image'
      - 'Build & publish the calculation image'
    types: [completed]
    branches: [master]
  pull_request:
    paths:
      - 'deploy/k8s/**'
      - '.github/workflows/cluster.yml' 

permissions:
  contents: read

jobs:
  round-trip:
    # A workflow_run fires on completion whatever the conclusion, so without this the cluster job
    # would run against an image build that FAILED — deploying whatever :master happened to be,
    # and reporting on it as though it were the new one.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Make room for the calculation image
        # It is ~2.6 GB and the runner arrives with ~25 GB free; a kind node image plus
        # ingress-nginx plus this does fit, but not with much to spare. "no space left on device"
        # here surfaces as an unrelated-looking ErrImagePull.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      - name: Raise the inotify limits kind needs
        # Below these, kube-proxy crash-loops and ingress-nginx never gets its certificate — and
        # it presents as a timeout waiting for a webhook, not as a resource problem. kind.sh
        # checks and refuses to continue, so this has to happen first.
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Install kind and kubectl
        run: |
          curl -sSfL -o kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          curl -sSfL -o kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          chmod +x kind kubectl
          sudo mv kind kubectl /usr/local/bin/
          kind --version && kubectl version --client=true | head -1

      - name: Bring up the cluster
        # kind.sh installs ingress-nginx and waits for it, and publishes the controller on 8880.
        run: deploy/k8s/kind.sh up

      - name: Deploy the published images
        # overlays/published, so this tests what ghcr actually serves rather than anything built
        # here. That is the point: it is the combination a real deployment gets.
        env:
          ESGAME_OVERLAY: published
        run: deploy/k8s/kind.sh deploy

      - name: A real round through the ingress
        run: deploy/k8s/ingress-test.sh

      - name: The scores have not moved
        # A characterization test, not a correctness one: it POSTs one fixed allocation and
        # compares the five indicators against numbers recorded from a previous run. Nobody has a
        # reference answer for this model, so "did the output change" is the honest question to
        # ask of it — and it is worth asking here, because this is the only job that runs the
        # model at all. Everywhere else, tools/R is parsed.
        #
        # A failure means find out why, not "the model is wrong". calculator.r, the base raster,
        # or the R packages underneath can all move it. The base image is pinned since
        # 2026-08-14, but the Dockerfile's install.packages lines still resolve whatever p3m
        # serves at build time, so this can still shift without anything here changing.
        run: tools/R/golden-test.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install the browser harness
        working-directory: v2
        run: npm ci

      - name: A browser plays two rounds
        # No interception: real Chrome against the live ingress. The only accommodation is
        # host-resolver-rules, in browser-round.config.ts, so /etc/hosts is left alone.
        working-directory: v2
        run: npx playwright test --config e2e-cluster/browser-round.config.ts

      - name: Install k6
        run: |
          curl -sSfL -o k6.tar.gz https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v2.2.0-linux-amd64/k6 /usr/local/bin/
          rm -rf k6.tar.gz k6-v2.2.0-linux-amd64
          k6 version

      - name: A classroom submits rounds at once
        # perf/calc-load.js existed for months and nothing ran it: it had been executed by hand
        # exactly once, on 2026-08-06. This is the only job with a live calculator behind an
        # ingress, so it is the only place it can run at all.
        #
        # THE GATE IS calc_errors, NOT LATENCY. A round either comes back 200 with a results[] or
        # it does not, and that means the same thing on every machine; round TIME does not. The
        # same healthy backend measured 12.9-28.2s on one machine on 2026-08-06 and 27-89s on
        # another on 2026-08-14, so any p95 budget picked here would fail runs where nothing is
        # wrong. P95_MS is therefore left unset and the script registers no latency threshold —
        # the numbers are recorded below instead, and a ceiling can be set once several runs on
        # THIS runner have established what normal looks like. TIMEOUT is the real upper bound:
        # a round that exceeds it fails as an error, which does trip the gate.
        #
        # No workspace cleanup: each iteration creates a GeoServer workspace by design, and the
        # whole cluster is deleted two steps down. Local runs need it (see perf/README.md).
        run: |
          set -o pipefail
          k6 run --quiet --no-color --summary-export=perf-summary.json \
            -e CALC_URL=http://127.0.0.1:8880/esgame \
            -e CALC_HOST=esgame-calculation.local \
            -e VUS=2 \
            -e TIMEOUT=300s \
            perf/calc-load.js

      - name: Record what it measured
        # `if: always()` so a run that FAILED the error gate still reports its numbers — that is
        # when they are most worth reading. Guarded on the file existing, because an earlier step
        # failing means k6 never wrote one, and a summary step that dies on a missing file would
        # replace a real failure with a confusing one.
        if: always()
        run: |
          [ -f perf-summary.json ] || { echo "no k6 summary — the load step did not run"; exit 0; }
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open('perf-summary.json'))['metrics']
          lat, err = m.get('calc_latency', {}), m.get('calc_errors', {})
          it = m.get('iterations', {}).get('count', 0)
          print('### Calculation backend under load\n')
          print(f'{it} rounds at VUS=2, through the ingress.\n')
          print('| | seconds |'); print('|---|---|')
          for k in ('min', 'med', 'avg', 'p(95)', 'max'):
              if k in lat:
                  print(f'| {k} | {lat[k]/1000:.1f} |')
          print(f'\nError rate: **{err.get("value", 0) * 100:.2f}%** '
                f'(the gate; latency is recorded, not thresholded).')
          PY

      - name: What the cluster looked like if any of that failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          for d in esgame-angular esgame-calculation esgame-geoserver; do
            echo "=== $d ==="
            kubectl describe deploy "$d" 2>/dev/null | tail -25 || true
            kubectl logs "deploy/$d" --tail=60 2>/dev/null || true
          done
          kubectl -n ingress-nginx get pods 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: deploy/k8s/kind.sh down || true
