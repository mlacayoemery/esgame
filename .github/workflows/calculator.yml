name: The static calculator reproduces the original

# tools/calculator serves the 2013 static game's own scoring model over HTTP. The only claim worth
# checking is that it still agrees with calc_files/game.js — everything else about it is small.
#
# Three checks, in the order they can fail:
#
#   1. The golden fixture is still what game.js produces TODAY. Without this the Python tests and
#      the fixture are a closed loop that would agree forever while drifting away from the game.
#   2. The service reproduces every allocation in that fixture.
#   3. The image builds, comes up non-root on a read-only root filesystem, and answers.
#
# Not path-filtered on tools/calculator/** ALONE: the oracle reads calc_files/game.js, so a change
# there must re-run this. A filter that omitted it would let the game's own scoring change while the
# service that claims to reproduce it stayed green — the failure mode #191 was about.

on:
  push:
    branches: [master]
    paths:
      - 'tools/calculator/**'
      - 'calc_files/**'
      - '.github/workflows/calculator.yml'
  pull_request:
    paths:
      - 'tools/calculator/**'
      - 'calc_files/**'
      - '.github/workflows/calculator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agrees-with-the-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: The golden fixture is what game.js produces today
        # Re-derives every case from the original and diffs. This is the open end of the loop.
        run: node --test 'tools/calculator/extract/*.test.mjs'

      - name: The extracted pack is what game.js contains today
        # The pack is generated, not copied. If regenerating it changes the file, the committed one
        # is stale — and a stale pack scores every round against last year's board while every test
        # that reads it still passes.
        run: |
          node tools/calculator/extract/extract-pack.mjs
          if ! git diff --quiet -- tools/calculator/data/tradeoff-ag.json; then
            echo "::error file=tools/calculator/data/tradeoff-ag.json::regenerating from calc_files/game.js changes this file; commit the regenerated pack"
            git --no-pager diff --stat -- tools/calculator/data/tradeoff-ag.json
            exit 1
          fi
          echo "the committed pack matches calc_files/game.js"

      - name: The service reproduces the fixture
        working-directory: tools/calculator
        run: python3 -m unittest discover -s test -t test -v

  the-image-works:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t esgame-static-calculator tools/calculator

      - name: It is small
        # The point of this service is that it is not the R calculator (2.6 GB). A dependency that
        # dragged in a geospatial stack would still pass every other check here.
        run: |
          bytes=$(docker image inspect esgame-static-calculator --format '{{.Size}}')
          mb=$((bytes / 1000000))
          echo "image is ${mb} MB"
          echo "image is ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "${mb}" -gt 200 ]; then
            echo "::error::the image is ${mb} MB; it was 73 MB when written and needs no dependencies at all"
            exit 1
          fi

      - name: It comes up non-root, read-only, and answers
        run: |
          set -euo pipefail
          docker run -d --rm --name calc --read-only -p 8000:8000 esgame-static-calculator
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health && break
            sleep 1
          done
          uid=$(docker exec calc id -u)
          echo "uid: ${uid}"
          [ "${uid}" = "10001" ] || { echo "::error::the container runs as uid ${uid}, expected 10001"; exit 1; }

          curl -sf http://127.0.0.1:8000/health | tee /tmp/health.json
          grep -q '"status": "ok"' /tmp/health.json

          # The example in the served spec must actually score, or the documentation is a promise.
          curl -sf http://127.0.0.1:8000/openapi.json -o /tmp/spec.json
          python3 -c "
          import json, urllib.request
          spec = json.load(open('/tmp/spec.json'))
          ex = spec['paths']['/score']['post']['requestBody']['content']['application/json']['examples']['one']['value']
          req = urllib.request.Request('http://127.0.0.1:8000/score', json.dumps(ex).encode(),
                                       {'Content-Type': 'application/json'})
          got = json.load(urllib.request.urlopen(req, timeout=10))
          print('scored:', got)
          assert 'score' in got, got
          "
          docker rm -f calc

      - name: It refuses a pack it cannot use
        # A calculator that starts without a usable board is a calculator that 500s on every round
        # while passing every health check.
        run: |
          if docker run --rm -e PACK=/nope.json esgame-static-calculator; then
            echo "::error::the service started with a missing pack"
            exit 1
          fi
          echo "refused, as it should"
