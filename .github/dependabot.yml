# Nothing watched base images or action versions until 2026-08-14.
#
# What that cost: GeoServer 3.0.0 was published and the k8s manifest went on saying "2.28.4 is the
# newest tag docker.osgeo.org publishes ... Checked, so nobody re-checks" for eight days. The note
# was true when written, which is exactly the failure mode — a fact nobody re-derives. The same
# exposure applied to node, nginx-unprivileged and the R base, and to every `uses:` in
# .github/workflows (which currently pin actions/setup-node at BOTH v6 and v7, in different files).
#
# Dependabot's security alerts were already on — that is how the extract-zip advisory surfaced. This
# is the other half: version updates, which are a different feed and were never configured.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  # One entry per directory holding a Dockerfile; Dependabot does not search recursively.
  - package-ecosystem: docker
    directory: /v2
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    # The static calculator: python:3.14-alpine and nothing else. There is no pip entry for it
    # because it installs no packages — the standard library is its whole runtime — so this base
    # image is the entirety of its dependency surface.
    directory: /tools/calculator
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    # This Dockerfile was `FROM rstudio/plumber` with no tag when this file was written, so this
    # entry did nothing: Dependabot cannot bump what is not pinned. It is `:v1.3.0` as of
    # 2026-08-14 — the same digest `latest` already resolved to — so this entry is live now.
    directory: /tools/R
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    # docker.osgeo.org is not Docker Hub and Dependabot's support for arbitrary registries is
    # uneven, so tools/newer-geoserver.sh checks this one directly every Monday rather than
    # trusting that this entry works. If Dependabot does open a PR here, the two agree and the
    # check passes on the bumped pin; if it never does, the script still says so.
    directory: /deploy/geoserver
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  # The example stack. Four more Dockerfiles, and the first version of this file missed all of
  # them while its comment described "the three Dockerfile directories" — tools/dependabot-coverage.sh
  # exists so that cannot happen quietly again.
  #
  # Two of these will actually produce bumps (python:3.14-slim). The other two cannot, and are
  # listed anyway so the coverage check stays a simple set comparison with no allow-list to rot:
  # pygeoapi is `:latest` and the frontend is `FROM ${ESGAME_IMAGE}`, a build argument. Whether
  # those two SHOULD be pinned is a separate judgement, made per image with reasons in
  # docs/dependency-review.rst — pygeoapi floats deliberately, because the example is read-only and
  # config-driven so drift surfaces as a startup failure, which CI now runs.
  - package-ecosystem: docker
    directory: /examples/esgame-dynamic/calculator
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /examples/esgame-dynamic/geoserver
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /examples/esgame-dynamic/pygeoapi
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /examples/esgame-dynamic/frontend
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(docker)"

  # pip. docs/requirements.txt is FULLY unpinned — `sphinx>=7`, `furo`, `myst-parser` — and
  # docs/dependency-review.rst already records that a Sphinx major could break the docs build with
  # no code change here. Nothing watched it until now.
  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: weekly, day: monday }
    # increase-if-necessary, because this file is deliberately an open range. The default strategy
    # RAISES THE FLOOR — the first run proposed `sphinx>=7` -> `sphinx>=9.1.0`, which pins nothing,
    # changes nothing about what pip installs (it takes the newest either way), and would churn
    # again on every Sphinx release. With this, Dependabot only opens a PR when the existing
    # constraint would EXCLUDE the new version, which `>=7` never does — so what is left is the
    # thing actually worth knowing: a release this range can no longer accept.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(pip)"

  # The example calculator, pinned exactly (fastapi==, uvicorn==), so this entry does what the
  # docker ones do for a pinned base: propose the bump rather than take it silently.
  - package-ecosystem: pip
    directory: /examples/esgame-dynamic/calculator
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(pip)"

  # npm is deliberately absent. The dev tree alone carries hundreds of packages and weekly version
  # PRs across an Angular toolchain would drown the signal this file exists to create; security
  # advisories there are covered by tools/audit.sh, which fails on anything unaccepted.
