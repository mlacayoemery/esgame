# Self-contained example of the esgame dynamic stack, using esgame's own (static grid) data:
#   frontend         - the esgame image + this example's SVG config + generated zone/background maps
#   calculator       - a tiny FastAPI stand-in: returns WCS URLs + simple scores (stateless)
#   geoserver        - serves the consequence rasters; persistent data dir, reloaded on every boot
#   geoserver-seed   - one-shot job that registers the rasters as external coverages (runs once)
#
# `make esgame-dynamic-example-up` from the repo root does the whole thing. Directly:
#
#   docker build -t local/esgame-core:latest v2          # ESGAME_IMAGE must already exist
#   ESGAME_IMAGE=local/esgame-core:latest docker compose -p esgame-dynamic-example up -d --build
#
# Or omit ESGAME_IMAGE to build against the published ghcr.io/mlacayoemery/esgame:master.
name: esgame-dynamic-example

volumes:
  geoserver-data:   # persistent GeoServer data dir (the catalog/sidecar config) - survives reboot

services:
  frontend:
    build:
      context: ./frontend
      args:
        ESGAME_IMAGE: ${ESGAME_IMAGE:-ghcr.io/mlacayoemery/esgame:master}
    image: esgame-dynamic-example-frontend
    container_name: esgame-dynamic-frontend
    # config.json is mounted (not just baked in), so you can tweak gridLineWidth / gridLineColor /
    # calcUrl / defaultMode WITHOUT an image rebuild. Apply an edit with:
    #   docker compose -p esgame-dynamic-example up -d --force-recreate frontend   (then reload)
    # (a single-file bind mount won't pick up in-place edits live; re-creating the container re-reads
    # it. calcUrl lives in config.json here, so the CALC_URL entrypoint injection isn't used.)
    volumes:
      - ./frontend/config.json:/usr/share/nginx/html/assets/config.json:ro
    ports:
      # 8080 container-side: the upstream esgame image runs nginx unprivileged (v2/Dockerfile).
      - "${ESGAME_FRONTEND_PORT:-81}:8080"
    depends_on: [calculator]

  calculator:
    build: ./calculator
    image: esgame-dynamic-example-calculator
    container_name: esgame-dynamic-calculator
    environment:
      # Browser-facing: these are the WCS URLs the calculator hands back, and the BROWSER
      # fetches them. It must therefore be the published host port below, not the in-network
      # name — and it has to move with it, or the round returns 200 with URLs nothing can
      # resolve. That failure mode is documented in docs/verification-status.rst.
      GEOSERVER_PUBLIC_URL: http://localhost:${ESGAME_GEOSERVER_PORT:-8080}/geoserver
    ports:
      # Deliberately NOT parameterised. This example bakes calcUrl into ./frontend/config.json
      # (that is the point it demonstrates), and the browser reads it from there — so a published
      # port that did not match would leave the stack starting cleanly and the round failing only
      # in the browser. Change both together or neither.
      - "8000:8000"

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.4
    container_name: esgame-dynamic-geoserver
    environment:
      CORS_ENABLED: "true"
    ports:
      - "${ESGAME_GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data    # persistent catalog: reloaded on every boot, no re-seed
      - ./geoserver/rasters:/rasters:ro        # the TIFF folder, referenced in place by external coverages

  # One-shot: registers /rasters/*.tif as external coverages, then exits. Idempotent (skips if the
  # data dir already has the workspace), so on reboot GeoServer just reloads from its data dir.
  geoserver-seed:
    build: ./geoserver
    image: esgame-dynamic-example-seeder
    container_name: esgame-dynamic-geoserver-seed
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
    volumes:
      - ./geoserver/rasters:/rasters:ro
      - ./geoserver/palettes.json:/palettes.json:ro
    depends_on: [geoserver]
    restart: "no"
