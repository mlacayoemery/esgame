<svg [ngStyle]="{'background-image': background + ', ' + background2}"
	attr.viewBox="0 0 {{boardData?.width ?? 0}} {{boardData?.height ?? 0}}">
	<defs>
		<pattern *ngFor="let productionType of productionTypes" [attr.id]="'pattern_' + productionType.id + '_' + boardData?.id"
			patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
			<line x1="0" y="0" x2="0" y2="10" [attr.stroke]="productionType.fieldColor" [attr.display]="displayPatterns" [attr.stroke-opacity]="getStrokeOpacity()" [attr.stroke-width]="getStrokeWidth()" />
		</pattern>
	</defs>
		<path troSvgField [field]="field"
			[clickable]="clickMode == GameBoardClickMode.Field && field.editable  && !readOnly"
			[showStroke]="this._boardData.gameBoardType != consequenceType"
			[hasOpacity]="consequenceFieldOpacity && this._boardData.gameBoardType == consequenceType"
			[gameBoardId]="boardData!.id"
			*ngFor="let field of fields" [attr.d]="field.path"></path>

</svg>

<!--
  THE LEGEND IS NOT IN THE SVG, and that is the point. It used to live in a
  <foreignObject x="1" y="1" width="20%" height="100px"> inside the viewBox, where one CSS pixel
  is one BOARD UNIT — so legend-board.component.scss's 20px colour ramp, 5px padding and 12px
  labels were 20, 5 and 12 units of the map. On the 468 x 335 board that reads as a small ramp.
  On a 28 x 29 board the ramp alone is two thirds of the map height, and `background: white`
  painted it as a slab over the top-left corner. Measured: 66 x 355 screen px of legend inside a
  foreignObject 103 px tall, magnified 17x relative to the Dutch board (11.82 px per unit against
  0.70).

  The legend's size should depend on the screen, not on the raster's resolution. As an ordinary
  absolutely-positioned sibling it lays out in real CSS pixels and is identical on every board —
  which is what grid-game-board.component.html has always done with the same component.
-->
<div class="legend-overlay" *ngIf="legend != undefined">
	<tro-legend-board [legendData]="legend" [isSmall]="hideLegend"></tro-legend-board>
</div>
<div class="consequences" *ngIf="consequenceFieldOpacity && mapType == consequenceType"
	[ngStyle]="{'background-image': background }"></div>
