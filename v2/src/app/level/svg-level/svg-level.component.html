<div class="panel left-panel">
	<div class="left-panel-gameboard" *ngFor="let board of (leftGameBoards | async)">
		<h2 class="small-title-left" [ngClass]="board.isPositive ? '--is-positive' : '--is-negative'" translate>{{
			"map_name_" + board.id }}</h2>
		<tro-svg-game-board class="side-board" [ngClass]="highlightFocusedBoard && (focusedGameBoard | async) == board ? '--is-center' : ''" [boardData]="board" hideLegend [clickMode]="clickMode.SelectBoard"
			[readOnly]="readOnly"></tro-svg-game-board>
	</div>
</div>
<div class="panel center-panel">
	<header>
		<p translate [translateParams]="{value: (level | async)?.levelNumber}" troLevelIndicator>Level</p>
		<h1 translate>{{ 'title' | translate }}</h1>
		<div class="header-icons">
			<!--
			  Loads the best board tools/optimizer/optimize.py found for this round. Hidden unless
			  the dataset names an answer file: an optimum belongs to the board it was computed on,
			  and a game with different rasters would be handed someone else's.
			-->
			<button type="button" class="icon-optimal" *ngIf="hasOptimalSolution"
				(click)="loadOptimalSolution()" [attr.aria-label]="'load optimal answer' | translate"
				[title]="'load optimal answer' | translate">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
					<path d="M7.5 12.4l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</button>
			<span class="icon-help-circle" (click)="openHelp()"></span>
		</div>
	</header>
	<div>
		<div class="production-type-buttons">
			<tro-production-type-button *ngFor="let type of productionTypes" [productionType]="type"
				layout2></tro-production-type-button>
		</div>
	</div>
	<div class="game-board-wrapper">
		<tro-svg-game-board [boardData]="focusedGameBoard | async" hideLegend [clickMode]="gameBoardClickMode.Field" class="main-board"
			[readOnly]="readOnly"></tro-svg-game-board>
		<div class="score-board-wrapper">
			<!-- Hidden rather than disabled at the ends of the run: a button that can never be
			     pressed is furniture, and "Previous" on round 1 never can be. -->
			<button troButton class="btn-prev" (click)="prevLevel()" *ngIf="(level | async)?.levelNumber != 1"
				translate>Previous Level</button>
			<button troButton class="btn-next" (click)="nextLevel()"
				*ngIf="(settings | async)?.infiniteLevels || (level | async)?.levelNumber == 1" translate>Next
				Level</button>

			<tro-score-board *ngIf="!((level | async)?.scores)" class="score-board"
				[class.--full-width]="!(showChart | async)"></tro-score-board>
			<tro-score-board *ngIf="(level | async)?.scores" isStatic [scores]="(level | async)!.scores" class="score-board"
				[class.--full-width]="!(showChart | async)"></tro-score-board>
			<!-- Beside the scores, at the size it is drawn. It used to open into a larger panel;
			     with the chart cropped to its own content there is nothing more to reveal. -->
			<div *ngIf="(showChart | async) && (chartEntries | async)?.length" class="chart-beside-scores">
				<tro-spider-chart [entries]="chartEntries | async"></tro-spider-chart>
			</div>
		</div>
	</div>
</div>
<div class="panel right-panel">
	<div class="right-panel-gameboard" *ngFor="let board of (rightGameBoards | async)">
		<tro-svg-game-board class="side-board" [ngClass]="highlightFocusedBoard && (focusedGameBoard | async) == board ? '--is-center' : ''" [boardData]="board" [clickMode]="clickMode.SelectBoard" hideLegend
			[readOnly]="readOnly"></tro-svg-game-board>
		<h2 class="small-title-right" [ngClass]="board.isPositive ? '--is-positive' : '--is-negative'" translate>{{
			"map_name_" + board.id }}</h2>
	</div>
</div>
<tro-help></tro-help>
<dialog id="svg-level-dialog">
	<p translate [translateParams]="{value: minSelected, current: currentlySelectedPercentage}">Select minimum fields</p>
	<form method="dialog">
		<button mat-button color="primary">OK</button>
	</form>
  </dialog>
