<div class="panel left-panel">
	<ng-container *ngFor="let board of (leftGameBoards | async)">
		<h2 translate>{{ "map_name_" + board.id }}</h2>
		<tro-grid-game-board [boardData]="board" hideLegend style="max-width: 250px" [clickMode]="clickMode.SelectBoard" [readOnly]="readOnly"></tro-grid-game-board>
	</ng-container>
</div>
<div class="panel center-panel">
	<header>
		<i></i>
		<h1>{{ 'title' | translate }}</h1>
		<div class="header-icons">
			<!--
			  Loads the best board tools/optimizer/optimize.py found for this round. Hidden unless
			  the dataset names an answer file: an optimum belongs to the board it was computed on,
			  and a game with different rasters would be handed someone else's.
			-->
			<button type="button" class="icon-optimal" *ngIf="hasOptimalSolution"
				(click)="loadOptimalSolution()" [attr.aria-label]="'load optimal answer' | translate"
				[title]="'load optimal answer' | translate">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
					<path d="M7.5 12.4l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</button>
			<span class="icon-help-circle" (click)="openHelp()"></span>
		</div>
	</header>
	<p translate [translateParams]="{value: (level | async)?.levelNumber}">Level</p>
	<div>
		<div class="production-type-buttons">
			<tro-production-type-button *ngFor="let type of productionTypes"
				[productionType]="type" layout2></tro-production-type-button>
		</div>
	</div>
	<div class="game-board-wrapper">
		<tro-grid-game-board *ngIf="focusedGameBoard != null" [readOnly]="readOnly" [clickMode]="clickMode.Field" [boardData]="focusedGameBoard | async"></tro-grid-game-board>
		<div class="score-board-wrapper">
			<tro-score-board class="score-board"></tro-score-board>
			<tro-score-indicator class="score-indicator"></tro-score-indicator>
			<!-- Hidden rather than disabled, as in svg-level. And `infiniteLevels` is honoured here
			     now: this button used to be `levelNumber != 1` outright, so the grid game stopped
			     after two rounds whatever the dataset said, while the SVG game did not. -->
			<button troButton class="btn-prev" (click)="prevLevel()" *ngIf="(level | async)?.levelNumber != 1" translate>Previous Level</button>
			<button troButton class="btn-next" (click)="nextLevel()" *ngIf="(settings | async)?.infiniteLevels || (level | async)?.levelNumber == 1" translate>Next Level</button>
		</div>
	</div>
</div>
<div class="panel right-panel">
	<ng-container *ngFor="let board of (rightGameBoards | async)">
		<h2 translate>{{ "map_name_" + board.id }}</h2>
		<tro-grid-game-board [boardData]="board" [readOnly]="readOnly" hideLegend style="max-width: 250px" [clickMode]="clickMode.SelectBoard"></tro-grid-game-board>
	</ng-container>
</div>
<tro-help></tro-help>
