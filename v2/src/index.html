<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TradeoffV2</title>
  <base href="/">
  <!-- Single Page Apps for GitHub Pages: restore the real path after the 404.html redirect.
       No-op when there is no "?/" redirect query (e.g. under nginx/Docker). https://github.com/rafgraph/spa-github-pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="An ecosystem-services trade-off game: allocate farm types across a landscape and see the effect on carbon, water, habitat and hunting.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Roboto (300/400/500) and Material Icons are self-hosted in src/assets/fonts and
       declared in src/styles.scss and src/styles/fonts.scss. They used to be fetched
       from Google Fonts, which meant the container image could not render text or icons
       correctly without reaching an external host — a problem on the offline and
       filtered networks this game is played on. Keep it that way: no external font
       links here. -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
