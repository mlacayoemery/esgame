<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TradeoffV2</title>
  <base href="/">
  <!-- Single Page Apps for GitHub Pages: restore the real path after the 404.html redirect.
       No-op when there is no "?/" redirect query (e.g. under nginx/Docker). https://github.com/rafgraph/spa-github-pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="An ecosystem-services trade-off game: allocate farm types across a landscape and see the effect on carbon, water, habitat and hunting.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
