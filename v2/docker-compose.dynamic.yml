# Overlay for the 'esgame-dynamic' stack: adds the R calculator + GeoServer (the containers
# places needs) and points the frontend at the local calculator. Use together with the base:
#
#   docker compose -p esgame-dynamic -f docker-compose.yml -f docker-compose.dynamic.yml up -d
#
# (the repo-root Makefile's esgame-dynamic-* targets do this).

services:
  esgame-core:
    environment:
      # The browser reaches the calculator via the published host port (it POSTs client-side).
      #
      # THE PATH IS PART OF THE VALUE. calcUrl is the endpoint the app POSTs to, not the origin it
      # lives at — game.service.ts passes it to HttpClient.post verbatim and appends nothing. The R
      # calculator serves `#* @post /esgame` (tools/R/calculator.r), so a bare origin here is a 404.
      #
      # That 404 is invisible in both logs, which is why it survived: the POST goes to :8000 so the
      # frontend's nginx never sees it, and it is rejected before entering the plumber handler so
      # the calculator logs nothing either. Measured 2026-09-02 — round 2 in a browser gave
      # "Something went wrong, please try again later" with no trace on either side.
      #
      # examples/esgame-dynamic is NOT a counter-example: its FastAPI calculator serves `@app.post("/")`,
      # so a bare origin is the correct endpoint THERE. Each stack states its own calculator's path.
      CALC_URL: "http://localhost:${ESGAME_CALC_PORT:-8000}/esgame"
      # "/" serves the dynamic game, which is the only game this stack's containers are for.
      #
      # Without this the stack came up serving the CLIENT-SIDE grid game with a calculator
      # configured — calcUrl and defaultMode are independent keys in config.json, and setting only
      # the first leaves the second at the image default of "static". docs/static-vs-dynamic.rst
      # states the invariant this broke: "Static: calcUrl is empty". docker-compose.rect.yml always
      # set this; the stack it overlays did not, so it was the overlay holding the base together.
      DEFAULT_MODE: "dynamic"

  esgame-calculator:
    build:
      context: ../tools/R
    image: local/esgame-calculator
    ports:
      - "${ESGAME_CALC_PORT:-8000}:8000"
    # url: http://localhost:8000/openapi.json
    #
    # THE BASE RASTER IS NOT IN THE IMAGE. tools/R/Dockerfile creates /app/data empty, because in
    # the cluster it is a mount whose content an init container supplies. Compose supplied nothing,
    # so this stack came up entirely healthy and failed on every round: measured 2026-08-14 against
    # the published image with the golden allocation, POST /esgame -> HTTP 500, and in the log
    # "/app/data/LU_and_NEW_hexa.tif: No such file or directory (GDAL error 4)". The frontend
    # renders that as the round reaching 0% of the model, which reads like a board/id mismatch and
    # sends you looking in the wrong place entirely.
    #
    # Read-only, and a file rather than the directory: /app/data is also where calculator.r writes
    # its output rasters, so mounting a host directory over it would put those on the host too.
    environment:
      # Stated, not defaulted. calculator.r refuses to start without it — see the note in
      # tools/R/calculator.r — so every deployment says which board it serves. The rectangular
      # overlay (docker-compose.rect.yml) overrides this together with the frontend's dataset.
      ESGAME_BASE_RASTER: "LU_and_NEW_hexa.tif"
      # THIS STACK'S OWN GEOSERVER. Both of these were missing, and calculator.r's default is
      # https://esgame-geoserver.azurewebsites.net/geoserver — a host nobody here controls. So the
      # stack came up healthy, scored a round, and handed the browser five coverage URLs pointing
      # off-site while the GeoServer it had just started sat unused.
      #
      # Measured on the committed stack, 2026-08-15: POST /esgame returned 200 with five finite
      # scores, every returned URL began https://esgame-geoserver.azurewebsites.net/geoserver/wcs,
      # and this stack's GeoServer held only its five stock demo workspaces (ne, nurc, sf, tiger,
      # topp) — nothing had been published to it. A 500 would have been kinder.
      #
      # GEOSERVER is server-to-server, so it uses the compose service name. GEOSERVER_PUBLIC_URL is
      # what the BROWSER fetches, so it must be the published host port — the same distinction the
      # k8s ConfigMap makes, and the same way of getting it wrong.
      GEOSERVER: "http://esgame-geoserver:8080/geoserver"
      GEOSERVER_PUBLIC_URL: "http://localhost:${ESGAME_GEOSERVER_PORT:-8080}/geoserver"
      # Stated, not guessed. calculator.r used to default these to admin/geoserver and warn; it
      # refuses to start without them now, because a guessed credential is what let a calculator
      # aimed at the wrong host keep trying instead of failing.
      #
      # These ARE the stock values, and that is fine here: esgame-geoserver in this stack is a
      # fresh GeoServer with its default admin account, on a developer's own machine. Saying so
      # out loud is the point — the cluster injects real ones from a Secret.
      GEOSERVER_USER: "${ESGAME_GEOSERVER_USER:-admin}"
      GEOSERVER_PASSWORD: "${ESGAME_GEOSERVER_PASSWORD:-geoserver}"
    volumes:
      - ./src/assets/images/LU_and_NEW_hexa.tif:/app/data/LU_and_NEW_hexa.tif:ro

  esgame-geoserver:
    # Built here (deploy/geoserver/Dockerfile) because upstream GeoServer runs as uid 0 at every
    # version; this one runs as 10001. Kept in step with the k8s base and
    # examples/esgame-dynamic/docker-compose.yml so all three stacks run the same server. GeoServer's
    # version is pinned inside that Dockerfile rather than here.
    #
    # CORS_ENABLED below is load-bearing HERE in a way it is not in the cluster: there is no ingress
    # in front of this to add the headers, so the browser's cross-origin fetches depend on GeoServer
    # applying it. That is exactly what a non-root GeoServer can silently fail to do, and why this
    # image fixes ownership at build time rather than in a manifest.
    image: ghcr.io/mlacayoemery/esgame-geoserver:master
    environment:
      CORS_ENABLED: "true"
    ports:
      - "${ESGAME_GEOSERVER_PORT:-8080}:8080"
    # url: http://localhost:8080/geoserver
